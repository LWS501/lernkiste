<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernkiste">
<meta name="mobile-web-app-capable" content="yes">

<title>Lernkiste</title>

<style>
/* VOICE everyday learning for a 14-year-old: friendly, focused, playful rewards
   IDEA a Karteikasten made from her own Geschichte notebook: ruled index cards with a red margin
   PICTURE the index card itself, large; its back carries a diagram with the answer highlighted
   COLOUR white paper, blue ink #1d2754, coral headline #e8664d, orange marker #f2911b; night = deep ink blue
   TYPE Nunito 800 + Nunito
   LAYOUT one phone column (max 560px): header pills, scrolling view, bottom tab bar; same column centred on a laptop */
:root{--bg:#fff;--ink:#1d2754;--mut:#5b6385;--line:#e1e6f6;--card:#fff;--rule:#dde5fa;--soft:#f3f5fd;--coral:#e8664d;--orange:#f2911b;--blue:#2f4fd1;--ok:#178a57;--bad:#cf3b31;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b{color:var(--coral)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.pill svg{width:15px;height:15px}
main{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:58px;background:none;border:0;color:var(--mut);font:700 12px Nunito,sans-serif;display:grid;place-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--coral)}
button{font:inherit;cursor:pointer}
.btn{min-height:46px;border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--blue);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.h{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:20px 0 8px;line-height:1.15}
.sub{color:var(--mut);font-size:14px}
.mt{margin-top:14px}
.nowrap{white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero{background:var(--coral);color:#fff;border-radius:22px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:6px}
.mascot{font-size:54px;width:86px;height:86px;display:grid;place-items:center;background:rgba(255,255,255,.22);border-radius:50%;line-height:1}
.hk{font-size:14px;font-weight:700;opacity:.92}
.hb{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:2px 0 8px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .5s}
.hs{font-size:14px;margin-top:8px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--blue));flex:none}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;align-content:start;min-height:112px}
.mode b{font-size:17px;line-height:1.2}
.mode span{font-size:14px;color:var(--mut);line-height:1.35}
.mode.rec{border:2px solid var(--orange)}
.mode em{font-style:normal;font-size:12px;font-weight:800;color:var(--orange)}
.mode svg{width:30px;height:30px;margin-bottom:2px}
details.sci{margin-top:18px;background:var(--soft);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
details.sci summary{font-weight:800;cursor:pointer;min-height:28px}
details.sci li{margin:6px 0;font-size:15px}
.sbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:800;flex:none}
.grow{flex:1}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:inherit}
.kcard{border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px 34px;min-height:340px;box-shadow:0 3px 0 var(--line);background-color:var(--card);background-image:linear-gradient(90deg,transparent 20px,rgba(232,102,77,.5) 20px,rgba(232,102,77,.5) 22px,transparent 22px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px)}
.turn{animation:turn .38s ease}
@keyframes turn{50%{transform:scaleX(.02)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.turn,.pop,.shake{animation:none!important}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--mut)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lv{display:inline-flex;gap:3px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lv i.f{background:var(--orange)}
.q{font-size:clamp(22px,6vw,27px);font-weight:800;line-height:1.22;letter-spacing:-.01em;margin:12px 0 14px}
.ans{font-size:19px;font-weight:800;line-height:1.4;margin:8px 0}
.numin{margin:6px 0 10px}
.numin input{flex:1;font:700 18px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);min-height:48px}
.unit{font-weight:800;white-space:nowrap}
.sol{margin:6px 0 0;padding-left:20px}
.sol li{margin:3px 0}
.zbox.okb{border-left-color:var(--ok)}
.zbox.nob{border-left-color:var(--bad)}
.decks{margin:6px 0 4px}
.hints{margin:0 0 10px;padding-left:20px;color:var(--blue);font-weight:700}
textarea,input[type=date],select{width:100%;font:16px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:86px;margin-top:10px;resize:vertical}
.vin{display:block;width:100%;box-sizing:border-box;font:700 18px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:6px;background:var(--bg);color:var(--ink);min-height:50px}
.vin:focus{outline:3px solid var(--blue);outline-offset:1px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three .btn{padding:8px 4px;font-size:15px}
.c0,.r0{background:#c2362c}
.c1,.r1{background:#b45309}
.c2,.r2{background:#157a4d}
.daily{display:grid;gap:2px;width:100%;text-align:left;margin-top:12px;padding:14px 16px;border-radius:18px;border:2px solid var(--orange);background:var(--card);color:var(--ink)}
.daily .dt{font-size:19px;font-weight:800}
.daily .ds{font-size:14px;color:var(--mut)}
.badge{font-size:12px;font-weight:800;color:#fff;background:#b45309;border-radius:99px;padding:2px 9px}
.notice.news{border-left-color:var(--blue);align-items:flex-start}
.notice{margin:4px 16px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--bad);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.zbox{background:var(--soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:10px;font-size:15px;margin:10px 0}
.zbox.why{border-left-color:var(--orange)}
.zbox.mine{border-left-color:var(--mut)}
.gx{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.gx svg{width:100%;height:auto;display:block}
.gx text{font-family:Nunito,sans-serif;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{padding:6px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:14px}
.st.hl{background:var(--orange);color:#fff;border-color:transparent}
.ar{color:var(--mut);font-weight:800}
.tlr{display:grid;grid-template-columns:5.4em 12px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:15px}
.tlr .y{font-weight:800;white-space:nowrap;text-align:right}
.tlr .d{width:12px;height:12px;border-radius:50%;background:var(--line)}
.tlr.hl{color:var(--coral);font-weight:800}
.tlr.hl .d{background:var(--coral)}
.lst{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:15px}
.lst b{white-space:nowrap}
.lst .hl{color:var(--coral)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;min-height:52px;font-weight:700}
.opt.ok{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.opt.no{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--soft);border:1px solid var(--line)}
.fb b.g{color:var(--ok)}
.fb b.n{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:56px;font-weight:700;font-size:15px;text-align:left}
.mi.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.mi.done{opacity:.5;border-color:var(--ok);text-decoration:line-through}
.shake{animation:shake .3s}
.ck{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;min-height:48px;font-size:15px}
.ck .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.ck.on{border-color:var(--ok)}
.ck.on .b{background:var(--ok);border-color:var(--ok)}
.big{text-align:center;padding:22px 10px}
.big .e{font-size:76px;line-height:1;animation:pop .45s ease}
.big .n{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:13px;color:var(--mut)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 3.4em;gap:4px 10px;align-items:center;margin:10px 0}
.mrow .lbl{grid-column:1/-1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.mrow .pc{text-align:right;font-weight:800;white-space:nowrap}
.ul{padding-left:18px;margin:6px 0}
.ul li{margin:4px 0;font-size:15px}
.tros{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tro{text-align:center;padding:12px 8px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.tro .e{font-size:42px;line-height:1.1}
.tro b{display:block;font-size:15px;margin-top:4px}
.tro span{font-size:12.5px;color:var(--mut);display:block;line-height:1.3}
.tro.lock .e{filter:grayscale(1);opacity:.3}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:800;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(16,20,43,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal>div{background:var(--card);color:var(--ink);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center}
.modal .e{font-size:96px;line-height:1;animation:pop .5s ease}
.tq{font-size:18px;font-weight:700;line-height:1.38;margin:12px 0 8px}
.mq{font-size:20px;font-weight:800;line-height:1.25;margin:14px 0 6px}
.msteps{list-style:none;padding:0;margin:8px 0}
.msteps li{padding:5px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.msteps .g>span{color:var(--ok);font-weight:800}
.msteps .n>span{color:var(--bad);font-weight:800}
.units{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.unit-b{min-height:46px;min-width:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:17px;padding:6px 12px}
.unit-b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cl{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:4px 8px;font-size:15px;margin-top:8px}
.cs{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--mut);margin-top:4px;vertical-align:-2px}
.cs.s1{border-color:var(--orange);background:linear-gradient(90deg,var(--orange) 50%,transparent 50%)}
.cs.s2{border-color:var(--ok);background:var(--ok)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Lern<b>kiste</b></div>
    <div class="pills" id="pills"></div>
  </header>
  <div id="notice"></div>
  <main id="view" tabindex="-1"></main>
  <nav id="nav">
    <button data-act="nav" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Lernen</button>
    <button data-act="nav" data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Fortschritt</button>
    <button data-act="nav" data-v="tro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg>Trophäen</button>
    <button data-act="nav" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Mehr</button>
  </nav>
</div>

<script type="application/json" class="lk-deck" id="deck-gesch-9-2026-11">{"id": "gesch-9-2026-11", "subject": "Geschichte", "title": "Geschichte – Klassenarbeit", "examDate": "2026-11-24", "topics": [{"id": "imp", "n": "Imperialismus", "c": "#f2911b"}, {"id": "kar", "n": "Karikatur", "c": "#2f4fd1"}, {"id": "glo", "n": "Glossar", "c": "#e8664d"}, {"id": "kla", "n": "Klassengesellschaft", "c": "#8b5cf6"}, {"id": "rev", "n": "Wiener Kongress & 1848", "c": "#0e9aa7"}], "graphics": {"motive": {"k": "wheel", "c": "Imperialismus", "items": ["wirtschaftlich", "gesellschaftlich", "politisch", "kulturell", "religiös", "nationalistisch"]}, "maechte": {"k": "list", "items": [["Großbritannien", "große Gebiete in Afrika"], ["Frankreich", "großes Kolonialreich in Afrika"], ["Deutschland", "beteiligte sich am Erwerb von Kolonien"], ["Belgien", "Kongo"], ["Portugal & Spanien", "besaßen schon länger Kolonien"], ["Italien", "versuchte auch, Kolonien zu erwerben"]]}, "karikatur": {"k": "steps", "items": ["1 Formale Aspekte", "2 Beschreiben", "3 Analysieren"]}, "klassen": {"k": "pyramid", "items": ["Adel", "Bürgertum", "Kleinbürgertum", "Arbeiter & Bauern"]}, "zeit": {"k": "timeline", "items": [["1814/15", "Wiener Kongress"], ["1832", "Hambacher Fest"], ["März 1848", "Revolution, Straßenkämpfe"], ["1848", "Nationalversammlung Frankfurt"], ["1849", "Revolution scheitert"]]}, "glossar": {"k": "list", "items": [["Arbeiterbewegung", "Kampf für bessere Arbeitsbedingungen"], ["Kommunismus", "Gesellschaft ohne Klassen"], ["Sozialdemokratie", "ohne Gewalt für die Arbeiter"]]}}, "cards": [{"id": "i1", "t": "imp", "q": "Was versteht man unter Imperialismus?", "a": "Die Ausweitung von Macht und Einfluss: andere Länder erobern oder beherrschen – mit dem Ziel, ein Imperium (Weltreich) zu werden.", "z": "Die Hochphase heißt „Hochimperialismus“, etwa 1880 bis 1914.", "w": "Warum reichte vielen Staaten ihr eigenes Land nicht mehr?", "h": ["Denk an das Wort „Imperium“.", "Es geht um Macht und Einfluss – auch weit weg vom eigenen Land."], "mc": {"o": ["Ausweitung von Macht und Einfluss durch Erobern oder Beherrschen anderer Länder", "Freiwilliger Zusammenschluss gleichberechtigter Staaten zum Handel", "Kampf der Arbeiter für bessere Arbeitsbedingungen", "Rückkehr der Fürsten an die Macht nach 1815"]}, "g": "motive"}, {"id": "i2", "t": "imp", "q": "Nenne die sechs Betrachtungsebenen (Motive) des Imperialismus.", "a": "wirtschaftlich, gesellschaftlich, politisch, kulturell, religiös, nationalistisch", "x": "Eselsbrücke W-G-P-K-R-N: „Wir Gehen Pizza Kaufen, Rate Nochmal!“", "h": ["Eine Ebene hat mit Geld zu tun, eine mit Glauben.", "W – G – P – K – R – N"], "mc": {"q": "Welche Ebene steht NICHT in deiner Tabelle der Motive?", "o": ["ökologisch", "religiös", "kulturell", "nationalistisch"]}, "g": "motive"}, {"id": "i3", "t": "imp", "q": "Welche wirtschaftlichen Ziele verfolgten die Kolonialmächte?", "a": "Mehr Land und Fläche; durch Rohstoffe mehr Geld; neue Waren; mehr Steuereinnahmen; mehr günstige Arbeiter.", "z": "Kolonien waren außerdem Absatzmärkte für Waren aus der eigenen Industrie.", "w": "Warum brauchten gerade Industrieländer so viele Rohstoffe?", "h": ["Was brauchen Fabriken?", "Rohstoffe, Geld, Arbeiter …"], "mc": {"q": "Welches Motiv ist wirtschaftlich?", "o": ["Rohstoffe gewinnen und mehr Steuern einnehmen", "Andersgläubige missionieren", "Die eigene Sprache verbreiten", "Stützpunkte gewinnen"]}, "g": "motive", "hl": 0}, {"id": "i4", "t": "imp", "q": "Welches gesellschaftliche Ziel hatte der Imperialismus?", "a": "Das Volk zu Hause einen und gesellschaftliche Probleme zu Hause lösen → soziale Frage.", "x": "Die soziale Frage meint die Not der Arbeiter in der Industrialisierung.", "z": "Kolonien sollten Arbeit und Wohlstand versprechen und von den Problemen zu Hause ablenken.", "w": "Wie hängt die Not der Fabrikarbeiter mit Kolonien in Afrika zusammen?", "h": ["Es geht um Probleme zu Hause.", "Stichwort: soziale …"], "mc": {"q": "Welches Stichwort gehört zum gesellschaftlichen Motiv?", "o": ["soziale Frage", "Kräftemessen der Mächte", "Mission", "Steuereinnahmen"]}, "g": "motive", "hl": 1}, {"id": "i5", "t": "imp", "q": "Welche politischen Ziele verfolgten die Kolonialmächte?", "a": "Außenpolitischen Einfluss auf der Welt gewinnen, Stützpunkte und Macht erlangen, Kräftemessen zwischen den europäischen Mächten.", "w": "Warum wollte keine Großmacht hinter den anderen zurückbleiben?", "h": ["Es geht um Macht zwischen den Staaten.", "Stützpunkte, Einfluss, Kräftemessen"], "mc": {"q": "„Stützpunkte gewinnen und Kräftemessen der Großmächte“ – welche Ebene?", "o": ["politisch", "kulturell", "wirtschaftlich", "religiös"]}, "g": "motive", "hl": 2}, {"id": "i6", "t": "imp", "q": "Was war das kulturelle Motiv?", "a": "Die eigene Kultur verbreiten, z. B. Sprache, Kleidung, Gerichte, Werte & Normen, Bildung.", "w": "Was sagt es über die Europäer aus, dass sie ihre Kultur für „besser“ hielten?", "h": ["Sprache, Essen, Werte …"], "mc": {"q": "„Sprache, Werte und Bildung verbreiten“ – welche Ebene?", "o": ["kulturell", "politisch", "nationalistisch", "wirtschaftlich"]}, "g": "motive", "hl": 3}, {"id": "i7", "t": "imp", "q": "Was war das religiöse Motiv?", "a": "Die eigene Religion verbreiten und Andersgläubige missionieren – und dadurch Macht ausüben.", "h": ["Glaube …", "missionieren"], "mc": {"q": "„Andersgläubige missionieren“ – welche Ebene?", "o": ["religiös", "kulturell", "gesellschaftlich", "politisch"]}, "g": "motive", "hl": 4}, {"id": "i8", "t": "imp", "q": "Was war das nationalistische Motiv?", "a": "Die eigene Nation vergrößern und ihr mehr Einfluss verschaffen – mit der Überzeugung: „Die eigene Nation ist die beste.“", "h": ["Nation …", "„Wir sind die Besten“"], "mc": {"q": "„Die eigene Nation ist die beste“ – welche Ebene?", "o": ["nationalistisch", "politisch", "religiös", "kulturell"]}, "g": "motive", "hl": 5}, {"id": "i9", "t": "imp", "q": "Welche Rolle spielte Rassismus im Imperialismus?", "a": "Der Imperialismus war von Rassismus angetrieben. Rassismus findet sich in allen Formen des Imperialismus: „Kein Imperialismus ohne Rassismus.“", "z": "Die Europäer hielten sich für überlegen (oft mit dem „Sozialdarwinismus“ begründet) und rechtfertigten so Eroberung und Ausbeutung.", "w": "Warum brauchten die Kolonialmächte eine Rechtfertigung für ihre Herrschaft?", "h": ["Ein Satz aus deiner Mitschrift beginnt mit „Kein …“"], "mc": {"q": "Welcher Satz steht so in deiner Mitschrift?", "o": ["Kein Imperialismus ohne Rassismus.", "Imperialismus war frei von Rassismus.", "Rassismus gab es nur beim religiösen Motiv.", "Rassismus entstand erst nach 1914."]}}, {"id": "i10", "t": "imp", "q": "Welche europäischen Mächte betrieben vor allem Imperialismus? Nenne mindestens fünf.", "a": "Großbritannien, Frankreich, Deutschland, Belgien, Portugal & Spanien, Italien.", "h": ["Zwei große Mächte mit viel Afrika …", "… plus ein kleines Land mit dem Kongo."], "g": "maechte"}, {"id": "i11", "t": "imp", "q": "Großbritannien – was weißt du über seine Kolonien?", "a": "Großbritannien hatte große Gebiete in Afrika.", "z": "Es hatte das größte Kolonialreich der Welt, z. B. auch Indien.", "mc": {"q": "Welches Land hatte das größte Kolonialreich der Welt?", "o": ["Großbritannien", "Italien", "Belgien", "Deutschland"]}, "g": "maechte", "hl": 0}, {"id": "i12", "t": "imp", "q": "Frankreich – was weißt du über seine Kolonien?", "a": "Frankreich hatte ein großes Kolonialreich in Afrika.", "g": "maechte", "hl": 1}, {"id": "i13", "t": "imp", "q": "Welche Rolle spielte Deutschland im Imperialismus?", "a": "Deutschland beteiligte sich am Erwerb von Kolonien.", "z": "Deutschland kam spät dazu (ab 1884). Beispiele: Deutsch-Südwestafrika (heute Namibia), Deutsch-Ostafrika, Kamerun, Togo.", "mc": {"q": "Welches Gebiet war eine deutsche Kolonie?", "o": ["Deutsch-Südwestafrika (heute Namibia)", "Kongo", "Indien", "Brasilien"]}, "g": "maechte", "hl": 2}, {"id": "i14", "t": "imp", "q": "Welches Gebiet beherrschte Belgien?", "a": "Den Kongo.", "z": "Der Kongo war zuerst sogar Privatbesitz von König Leopold II.", "mc": {"q": "Welches Land beherrschte den Kongo?", "o": ["Belgien", "Frankreich", "Italien", "Portugal"]}, "g": "maechte", "hl": 3}, {"id": "i15", "t": "imp", "q": "Was unterschied Portugal & Spanien von den anderen Mächten?", "a": "Sie besaßen schon länger Kolonien.", "z": "Schon seit dem Zeitalter der Entdeckungen (ab etwa 1500).", "mc": {"q": "Welche Länder besaßen schon länger Kolonien?", "o": ["Portugal & Spanien", "Deutschland & Italien", "Belgien & Deutschland", "Italien & Frankreich"]}, "g": "maechte", "hl": 4}, {"id": "i16", "t": "imp", "q": "Was weißt du über Italien im Imperialismus?", "a": "Italien versuchte auch, Kolonien zu erwerben.", "g": "maechte", "hl": 5}, {"id": "k1", "t": "kar", "q": "In welchen drei Schritten analysierst du eine Karikatur?", "a": "1. Formale Aspekte  2. Beschreiben  3. Analysieren", "z": "Oft gehört als 4. Schritt „Beurteilen“ dazu. Frag nach, ob eure Lehrkraft das erwartet.", "h": ["Erst die Fakten zur Quelle …", "… dann was man sieht, dann was es bedeutet."], "mc": {"q": "Was ist die richtige Reihenfolge?", "o": ["Formale Aspekte → Beschreiben → Analysieren", "Analysieren → Beschreiben → Formale Aspekte", "Beschreiben → Analysieren → Formale Aspekte", "Formale Aspekte → Analysieren → Beschreiben"]}, "g": "karikatur"}, {"id": "k2", "t": "kar", "q": "Was gehört zu den formalen Aspekten einer Karikatur?", "a": "Autor, Titel, Quellenart, Wo?, Wann?, historischer Kontext.", "x": "Achtung Rechtschreibung: „Autor“ (nicht „Author“).", "h": ["Sechs Punkte: wer, wie heißt sie, welche Art …", "… wo, wann, welcher Zusammenhang."], "mc": {"q": "Was gehört NICHT zu den formalen Aspekten?", "o": ["Kritik an wen?", "Autor", "Quellenart", "historischer Kontext"]}, "g": "karikatur", "hl": 0}, {"id": "k3", "t": "kar", "q": "Was machst du beim Schritt „Beschreiben“?", "a": "Vordergrund und Hintergrund beschreiben: Was sieht man?", "w": "Warum solltest du beim Beschreiben noch nicht deuten?", "mc": {"q": "Was gehört zum Beschreiben?", "o": ["Vordergrund/Hintergrund – was sieht man?", "Kritik an wen?", "Wer ist der Autor?", "Was könnte das bedeuten?"]}, "g": "karikatur", "hl": 1}, {"id": "k4", "t": "kar", "q": "Welche Fragen stellst du beim Schritt „Analysieren“?", "a": "Was könnte das bedeuten? Wer wurde dargestellt? Kritik an wen?", "h": ["Drei Fragen: Bedeutung, Person, Kritik"], "mc": {"q": "Welche Frage gehört zum Analysieren?", "o": ["Kritik an wen?", "Wann erschien sie?", "Was ist im Hintergrund?", "Wie heißt der Titel?"]}, "g": "karikatur", "hl": 2}, {"id": "k5", "t": "kar", "q": "Zu welchem Schritt gehört: „Im Vordergrund steht ein dicker Mann mit Zylinder auf einer Weltkugel.“?", "a": "Beschreiben – du gibst wieder, was man sieht, ohne es zu deuten.", "mc": {"o": ["Beschreiben", "Formale Aspekte", "Analysieren", "Gar keinem"]}, "g": "karikatur", "hl": 1}, {"id": "k6", "t": "kar", "q": "Zu welchem Schritt gehört: „Der Zeichner kritisiert die Gier der Kolonialmächte.“?", "a": "Analysieren – du deutest die Bedeutung und sagst, wen die Karikatur kritisiert.", "mc": {"o": ["Analysieren", "Beschreiben", "Formale Aspekte", "Gar keinem"]}, "g": "karikatur", "hl": 2}, {"id": "k7", "t": "kar", "q": "Zu welchem Schritt gehört: „Die Karikatur erschien 1904 in einer deutschen Satirezeitschrift.“?", "a": "Formale Aspekte – das sind Wann, Wo und Quellenart.", "mc": {"o": ["Formale Aspekte", "Beschreiben", "Analysieren", "Gar keinem"]}, "g": "karikatur", "hl": 0}, {"id": "g1", "t": "glo", "q": "Was bedeutet „Arbeiterbewegung“?", "a": "Der Kampf für bessere Arbeitsbedingungen.", "z": "Dazu gehörten z. B. Gewerkschaften und Arbeiterparteien.", "mc": {"o": ["Kampf für bessere Arbeitsbedingungen", "Gesellschaft ohne Klassen", "Ausweitung von Macht und Einfluss", "Versammlung auf dem Hambacher Schloss"]}, "g": "glossar", "hl": 0}, {"id": "g2", "t": "glo", "q": "Was bedeutet „Kommunismus“?", "a": "Eine Gesellschaft ohne Klassen.", "z": "Nach Karl Marx sollen Fabriken und Boden allen gehören – notfalls erkämpft durch eine Revolution.", "mc": {"o": ["Gesellschaft ohne Klassen", "Ohne Gewalt für die Arbeiter", "Kampf für bessere Arbeitsbedingungen", "Herrschaft des Adels"]}, "g": "glossar", "hl": 1}, {"id": "g3", "t": "glo", "q": "Was bedeutet „Sozialdemokratie“?", "a": "Ohne Gewalt für die Arbeiter eintreten.", "z": "Also durch Reformen, Wahlen und Gesetze statt durch Revolution.", "mc": {"o": ["Ohne Gewalt für die Arbeiter", "Gesellschaft ohne Klassen", "Eigene Nation ist die beste", "Gleichgewicht der Mächte"]}, "g": "glossar", "hl": 2}, {"id": "g4", "t": "glo", "q": "Was ist der Unterschied zwischen Kommunismus und Sozialdemokratie?", "a": "Kommunismus will eine Gesellschaft ohne Klassen. Sozialdemokratie setzt sich ohne Gewalt für die Arbeiter ein.", "z": "Kommunisten hielten oft eine Revolution für nötig, Sozialdemokraten setzten auf Reformen.", "w": "Welcher Weg erscheint dir realistischer – und warum?", "g": "glossar"}, {"id": "c1", "t": "kla", "q": "Adel: Worauf beruhte seine Stellung, und welche Rolle hatte er?", "a": "Grundlage: Familienbesitz, hoher sozialer Rang → Abstammung. Führende Position in Politik und Militär.", "h": ["Man wird hineingeboren …", "Politik und …"], "mc": {"q": "Was war die Grundlage des Adels?", "o": ["Abstammung, Familienbesitz, hoher Rang", "Bildung", "Kapital aus Fabriken", "Landwirtschaft"]}, "g": "klassen", "hl": 0}, {"id": "c2", "t": "kla", "q": "Was war die Grundlage des Wirtschaftsbürgertums?", "a": "Kapital und Besitz, z. B. Familienbesitz, Unternehmen.", "mc": {"q": "Ein Fabrikbesitzer gehört zum …", "o": ["Wirtschaftsbürgertum", "Bildungsbürgertum", "Kleinbürgertum", "Adel"]}, "g": "klassen", "hl": 1}, {"id": "c3", "t": "kla", "q": "Was war die Grundlage des Bildungsbürgertums?", "a": "Bildung, z. B. Anwälte und Ärzte.", "mc": {"q": "Ein Arzt gehört zum …", "o": ["Bildungsbürgertum", "Wirtschaftsbürgertum", "Kleinbürgertum", "Proletariat"]}, "g": "klassen", "hl": 1}, {"id": "c4", "t": "kla", "q": "Wie lebte das Bürgertum, und worauf war es stolz?", "a": "In hellen, geräumigen Villen oder Wohnungen; stolz auf das eigenständig Erreichte.", "w": "Warum war „selbst erreicht“ für Bürger so wichtig – im Gegensatz zum Adel?", "g": "klassen", "hl": 1}, {"id": "c5", "t": "kla", "q": "Beschreibe das Kleinbürgertum.", "a": "Bessere Arbeitsbedingungen als Arbeiter, aber niedriger Rang; hoffen auf Aufstieg; drohende Gefahr, ins Proletariat „abzurutschen“. Z. B. Handwerker, Angestellte, Dienstmädchen.", "h": ["Zwischen Bürgertum und Arbeitern …", "Hoffnung und Angst"], "mc": {"q": "Welche Schicht hoffte auf Aufstieg und fürchtete das Abrutschen ins Proletariat?", "o": ["Kleinbürgertum", "Adel", "Bildungsbürgertum", "Bauern"]}, "g": "klassen", "hl": 2}, {"id": "c6", "t": "kla", "q": "Beschreibe die Arbeiterschaft (das Proletariat).", "a": "Grundlage: kein Besitz, nur Arbeit. Keine Rechte, keine fairen Löhne, abhängig von Fabrikbesitzern. Wohnen in prekären (unsicheren, ärmlichen) Verhältnissen.", "x": "Achtung Rechtschreibung: „Proletariat“ (nicht „Poleteriat“).", "w": "Warum entstand gerade aus dieser Schicht die Arbeiterbewegung?", "mc": {"q": "Welche Schicht hatte keinen Besitz außer ihrer Arbeit?", "o": ["Arbeiterschaft (Proletariat)", "Kleinbürgertum", "Bauern", "Bildungsbürgertum"]}, "g": "klassen", "hl": 3}, {"id": "c7", "t": "kla", "q": "Welche Probleme hatten die Bauern?", "a": "Grundlage: Landwirtschaft. Der industrielle Fortschritt führte zu rentablen Großbetrieben; ausländische Waren gefährdeten ihre Lebensgrundlage.", "z": "Zum Beispiel billiges Getreide aus Amerika und Russland.", "mc": {"q": "Was gefährdete die Lebensgrundlage der Bauern?", "o": ["Ausländische Waren und rentable Großbetriebe", "Der Wiener Kongress", "Die Mission", "Zu viel Bildung"]}, "g": "klassen", "hl": 3}, {"id": "c8", "t": "kla", "q": "Ordne die Schichten der Klassengesellschaft von oben nach unten.", "a": "Adel → Bürgertum (Wirtschafts- und Bildungsbürgertum) → Kleinbürgertum → Arbeiterschaft und Bauern", "z": "Das ist ein vereinfachtes Modell: Großbauern konnten auch wohlhabend sein.", "g": "klassen"}, {"id": "c9", "t": "kla", "q": "Wie hängen Klassengesellschaft und Imperialismus zusammen?", "a": "Die Not der Arbeiter (soziale Frage) sollte auch durch Kolonien gelöst werden: das Volk zu Hause einen und von den Problemen ablenken – das gesellschaftliche Motiv.", "z": "Diese Verknüpfung steht nicht wörtlich in der Mitschrift, ist aber eine typische Transferfrage.", "w": "Findest du, dass Kolonien die soziale Frage wirklich lösen konnten?", "g": "motive", "hl": 1}, {"id": "r1", "t": "rev", "q": "Wann fand der Wiener Kongress statt?", "a": "1814/15", "mc": {"o": ["1814/15", "1832", "1848", "1871"]}, "g": "zeit", "hl": 0}, {"id": "r2", "t": "rev", "q": "Was wollten die Fürsten auf dem Wiener Kongress?", "a": "Das Gleichgewicht der Mächte zur Sicherung des Friedens – und den eigenen Machterhalt.", "z": "Diese Politik nennt man „Restauration“: die alte Ordnung wiederherstellen.", "h": ["Zwei Ziele: Frieden und …"], "mc": {"q": "Was war ein Ziel der Fürsten 1814/15?", "o": ["Gleichgewicht der Mächte und eigener Machterhalt", "Ein deutscher Nationalstaat mit Verfassung", "Kolonien in Afrika", "Wahlrecht für alle"]}, "g": "zeit", "hl": 0}, {"id": "r3", "t": "rev", "q": "Welche Folgen hatte die Politik des Wiener Kongresses?", "a": "Die Nationalbewegung wurde unterdrückt → die Menschen waren unzufrieden und wollten mitbestimmen.", "z": "Z. B. die Karlsbader Beschlüsse 1819: Zensur und Überwachung der Universitäten.", "g": "zeit", "hl": 0}, {"id": "r4", "t": "rev", "q": "Was war der Vormärz?", "a": "Die Zeit vor der Märzrevolution 1848: Unruhen und Versammlungen, z. B. 1832 auf dem Hambacher Schloss. Forderung nach Nationalstaat und Verfassung. Die Fürsten reagierten mit Unterdrückung.", "h": ["Der Name sagt: vor dem März …", "… welchem März? 1848"], "g": "zeit", "hl": 1}, {"id": "r5", "t": "rev", "q": "Wann und wo fand die berühmte Versammlung im Vormärz statt?", "a": "1832 auf dem Hambacher Schloss (Hambacher Fest).", "z": "Dort wehten schwarz-rot-goldene Fahnen – Symbol für Einheit und Freiheit.", "mc": {"q": "Wann war das Hambacher Fest?", "o": ["1832", "1815", "1848", "1849"]}, "g": "zeit", "hl": 1}, {"id": "r6", "t": "rev", "q": "Was forderten die Menschen im Vormärz?", "a": "Einen Nationalstaat und eine Verfassung.", "z": "Kurz gesagt: „Einheit und Freiheit“.", "mc": {"o": ["Nationalstaat und Verfassung", "Kolonien und Stützpunkte", "Rückkehr der Fürsten", "Gesellschaft ohne Klassen"]}, "g": "zeit", "hl": 1}, {"id": "r7", "t": "rev", "q": "Was geschah im März 1848?", "a": "Eine aktive Revolution mit Straßenkämpfen; der preußische König versprach Reformen; die erste Nationalversammlung trat in Frankfurt zusammen.", "z": "Die Nationalversammlung tagte ab Mai 1848 in der Frankfurter Paulskirche. Der preußische König war Friedrich Wilhelm IV.", "h": ["Straßen …", "… König …", "… Frankfurt"], "g": "zeit", "hl": 2}, {"id": "r8", "t": "rev", "q": "Was war das Ziel der Nationalversammlung in Frankfurt?", "a": "Eine Verfassung mit Menschen- und Bürgerrechten und Wahlrecht.", "mc": {"o": ["Verfassung mit Menschen- und Bürgerrechten, Wahlrecht", "Gleichgewicht der Mächte", "Ein Kolonialreich in Afrika", "Die Macht der Fürsten sichern"]}, "g": "zeit", "hl": 3}, {"id": "r9", "t": "rev", "q": "Nenne Gründe, warum die Revolution scheiterte.", "a": "1. Die Fürsten erlangten die Macht zurück (sie hatten das Militär). 2. Der preußische König lehnte die Verfassung ab. 3. Die Revolutionäre waren sich nicht einig. 4. Politiker schlossen Kompromisse mit der Obrigkeit.", "z": "Genauer: 1849 lehnte Friedrich Wilhelm IV. die Kaiserkrone ab, die ihm die Nationalversammlung angeboten hatte – und damit auch die Reichsverfassung.", "h": ["Vier Gründe: Militär, König, Streit, Kompromisse"], "g": "zeit", "hl": 4}, {"id": "r10", "t": "rev", "q": "Was lehnte der preußische König ab?", "a": "Die  / gender (= male / female)“?", "a": "Geschlecht", "mc": {"o": ["Geschlecht", "Ureinwohner", "multikulturell", "ethnische (= Volks-) Struktur / Gruppe / Minderheit"]}, "z": "Feiner Unterschied: „sex“ meint eher das biologische, „gender“ das soziale Geschlecht.", "ok": ["Geschlecht"], "lang": "de"}, {"id": "epg", "t": "pop", "q": "Population growth (in per cent) = ?", "a": "RNI + immigration − emigration", "x": "Auf dem Blatt steht „RNI + migration − emigration“. Gemeint ist immigration (Zuwanderung) minus emigration (Auswanderung).", "h": ["RNI plus Zuwanderung …", "… minus Auswanderung"], "g": "growth", "hl": 4, "mc": {"o": ["RNI + immigration − emigration", "RNI − immigration + emigration", "birth rate + death rate", "RNI × migration"]}, "ok": ["RNI + immigration − emigration|RNI + migration − emigration|RNI+immigration-emigration|RNI+migration-emigration|rate of natural increase + immigration − emigration"], "lang": "en"}, {"id": "eru", "t": "dist", "q": "Was bedeutet „rural vs. urban“?", "a": "rural = countryside / village (rural settlement); urban = city (urban settlement)", "z": "Auf Deutsch: ländlich vs. städtisch (steht nicht auf dem Blatt).", "g": "opp", "hl": 1, "mc": {"o": ["rural = village / countryside; urban = city", "rural = city; urban = village", "rural = poor; urban = rich", "rural = old; urban = new"]}}, {"id": "eru2", "t": "dist", "q": "Wie heißt „ländlich / städtisch“ auf Englisch?", "a": "rural / urban", "x": "Merkhilfe: urban – wie „Urbanisierung“ (Verstädterung).", "g": "opp", "hl": 1, "h": ["Beginnt mit „ru…“ und „ur…“"], "mc": {"o": ["rural / urban", "urban / rural", "sparsely / densely", "village / settlement"]}, "ok": ["rural", "urban"], "need": 2, "lang": "en"}, {"id": "eledc", "t": "soc", "q": "Wofür steht LEDC?", "a": "Less economically developed country", "g": "dev", "hl": 2, "z": "Auf Deutsch etwa: wirtschaftlich weniger entwickeltes Land.", "mc": {"o": ["Less economically developed country", "Least educated developing country", "Low nsity?", "a": "300 people per km²", "num": {"v": 300, "u": "people per km²"}, "s": ["density = people : area", "3000 : 10 = 300", "300 people per km²"], "z": "Formel ergänzt (berechnet – bitte prüfen); 300 ist das Beispiel vom Blatt."}, {"id": "xp1", "t": "pop", "q": "Fill in the gap: In many LEDCs the ___ rate is high: many babies are born per 1000 people.", "a": "birth", "ok": ["birth"], "lang": "en", "add": true, "x": "In many LEDCs the birth rate is high: many babies are born per 1000 people. – In vielen LEDCs ist die Geburtenrate hoch.", "h": ["Beginnt mit „bi…“"]}, {"id": "xp2", "t": "pop", "q": "Fill in the gap: Better health care means people live longer, so life ___ goes up.", "a": "expectancy", "ok": ["expectancy"], "lang": "en", "add": true, "x": "Better health care means people live longer, so life expectancy goes up. – Bessere Gesundheitsversorgung → die Lebenserwartung steigt.", "h": ["Beginnt mit „ex…“"]}, {"id": "xp3", "t": "pop", "q": "Fill in the gap: The ___ capacity is the number of people the Earth can support.", "a": "carrying", "ok": ["carrying"], "lang": "en", "add": true, "x": "The carrying capacity is the number of people the Earth can support. – Tragfähigkeit der Erde.", "h": ["Beginnt mit „ca…“"]}, {"id": "xp4", "t": "pop", "q": "Fill in the gap: In Germany the population is ___: there are more and more old people.", "a": "ageing", "ok": ["ageing"], "lang": "en", "add": true, "x": "In Germany the population is ageing: there are more and more old people. – Die Bevölkerung überaltert.", "h": ["Beginnt mit „ag…“"]}, {"id": "xp5", "t": "pop", "q": "Fill in the gap: There are more births than deaths, so the population does not decrease, it ___.", "a": "increases", "ok": ["increases|grows|is increasing|is growing"], "lang": "en", "add": true, "x": "There are more births than deaths, so the population does not decrease, it increases. – Die Bevölkerung nimmt zu.", "h": ["Beginnt mit „in…“"]}, {"id": "xd1", "t": "dist", "q": "Fill in the gap: Only a few people live in the desert. It is ___ populated.", "a": "sparsely", "ok": ["sparsely"], "lang": "en", "add": true, "x": "Only a few people live in the desert. It is sparsely populated. – Die Wüste ist wenig besiedelt.", "h": ["Beginnt mit „sp…“"]}, {"id": "xd2", "t": "dist", "q": "Fill in the gap: Tokyo is very ___ populated: thousands of people live on one km².", "a": "densely", "ok": ["densely"], "lang": "en", "add": true, "x": "Tokyo is very densely populated: thousands of people live on one km². – Tokio ist dicht besiedelt.", "h": ["Beginnt mit „de…“"]}, {"id": "xd3", "t": "dist", "q": "Fill in the gap: Many slum ___ live in marginalised settlements at the edge of the city.", "a": "dwellers", "ok": ["dwellers|dweller"], "lang": "en", "add": true, "x": "Many slum dwellers live in marginalised settlements at the edge of the city. – Slumbewohner leben in Marginalsiedlungen am Stadtrand.", "h": ["Beginnt mit „dw…“"]}, {"id": "xl1", "t": "life", "q": "Fill in the gap: There is a ___ of clean water in many slums.", "a": "lack", "ok": ["lack"], "lang": "en", "add": true, "x": "There is a lack of clean water in many slums. – Es gibt einen Mangel an sauberem Wasser.", "h": ["Beginnt mit „la…“"]}, {"id": "xl2", "t": "life", "q": "Fill in the gap: After the drought there was a terrible ___: people had nothing to eat.", "a": "famine", "ok": ["famine"], "lang": "en", "add": true, "x": "After the drought there was a terrible famine: people had nothing to eat. – Nach der Dürre gab es eine Hungersnot.", "h": ["Beginnt mit „fa…“"]}, {"id": "xl3", "t": "life", "q": "Fill in the gap: People who cannot read or write are ___.", "a": "illiterate", "ok": ["illiterate"], "lang": "en", "add": true, "x": "People who cannot read or write are illiterate. – Wer nicht lesen und schreiben kann, ist Analphabet.", "h": ["Beginnt mit „il…“"]}, {"id": "xl4", "t": "life", "q": "Fill in the gap: Children who do not get enough healthy food suffer from ___.", "a": "malnutrition", "ok": ["malnutrition"], "lang": "en", "add": true, "x": "Children who do not get enough healthy food suffer from malnutrition. – Kinder ohne genug gesundes Essen leiden an Fehlernährung.", "h": ["Beginnt mit „ma…“"]}, {"id": "xs1", "t": "soc", "q": "Fill in the gap: Rich and poor people live in different parts of the city. This is called spatial ___.", "a": "segregation", "ok": ["segregation|spatial segregation"], "lang": "en", "add": true, "x": "Rich and poor people live in different parts of the city. This is called spatial segregation. – Räumliche Trennung von Arm und Reich.", "h": ["Beginnt mit „se…“"]}, {"id": "xs2", "t": "soc", "q": "Fill in the gap: A country that is quickly building up its industry is a newly ___ country (NIC).", "a": "industrialised", "ok": ["industrialised"], "lang": "en", "add": true, "x": "A country that is quickly building up its industry is a newly industrialised country (NIC). – NIC = Schwellenland.", "h": ["Beginnt mit „in…“"]}], "match": [{"n": "Abkürzung ↔ Bedeutung", "p": [["LEDC", "less economically developed country"], ["NIC", "newly industrialised country"], ["MEDC", "more economically developed country"], ["RNI", "rate of natural increase"]]}, {"n": "Gegensätze", "p": [["rural", "urban"], ["to increase", "to decrease"], ["overpopulation", "underpopulation"], ["birth rate", "death rate"], ["sparsely populated", "densely populated"]]}, {"n": "Lebensbedingungen EN ↔ DE", "p": [["famine", "Hungersnot"], ["malnutrition", "Fehlernährung"], ["illiteracy", "Analphabetismus"], ["sanitation", "sanitäre Anlagen"], ["poverty", "Armut"], ["retirement", "Rente"]]}, {"n": "Menschen EN ↔ DE", "p": [["inhabitant", "Einwohner"], ["citizen", "Bürger"], ["(slum) dweller", "(Slum-)Bewohner"], ["foreigner", "Ausländer"], ["tribe", "Stamm"], ["indigenous people", "Ureinwohner"]]}, {"n": "Bevölkerung EN ↔ DE", "p": [["life expectancy", "Lebenserwartung"], ["carrying capacity", "Tragfähigkeit"], ["population density", "Bevölkerungsdichte"], ["spatial segregation", <script type="application/json" class="lk-deck" id="deck-mathe-9-2026-11">{"id": "mathe-9-2026-11", "kind": "math", "subject": "Mathe", "title": "Mathe – Körper: Oberfläche und Volumen", "examDate": "2026-11-30", "source": "Arbeitsblätter Quader, Zylinder, Pyramide, Kegel, Kugel und Checkliste (Fotos vom 26.11.2026)", "topics": [{"id": "g", "n": "Begriffe & Netze", "c": "#0e9aa7"}, {"id": "qz", "n": "Quader & Zylinder", "c": "#2f4fd1"}, {"id": "py", "n": "Pyramide", "c": "#f2911b"}, {"id": "ke", "n": "Kegel", "c": "#e8664d"}, {"id": "ku", "n": "Kugel", "c": "#8b5cf6"}, {"id": "zs", "n": "Zusammengesetzt", "c": "#178a57"}, {"id": "um", "n": "Umkehren & Verändern", "c": "#b0307a"}], "graphics": {"quader": {"k": "shape", "s": "quader", "cap": "Quader: Länge a, Breite b, Höhe c"}, "zylinder": {"k": "shape", "s": "zylinder", "cap": "Zylinder: Radius r, Höhe h"}, "pyramide": {"k": "shape", "s": "pyramide", "cap": "Pyramide: Grundkante a, Körperhöhe h, Seitenhöhe h_{a}"}, "kegel": {"k": "shape", "s": "kegel", "cap": "Kegel: Radius r, Höhe h, Mantellinie s"}, "kugel": {"k": "shape", "s": "kugel", "cap": "Kugel: Radius r"}, "prisma": {"k": "shape", "s": "prisma"}, "nzyl": {"k": "shape", "s": "netz-zylinder"}, "nkeg": {"k": "shape", "s": "netz-kegel"}, "npyr": {"k": "shape", "s": "netz-pyramide"}, "eis": {"k": "shape", "s": "eiswaffel", "cap": "Eiswaffel: Kegel mit Halbkugel obendrauf"}, "turm": {"k": "shape", "s": "turm", "cap": "Zylinder mit Kegel obendrauf"}, "opyr": {"k": "steps", "items": ["h_{a} mit Pythagoras", "Mantel M", "O = G + M"]}, "okeg": {"k": "steps", "items": ["s mit Pythagoras", "Grundfläche G", "Mantel M", "O = G + M"]}, "umk": {"k": "steps", "items": ["Formel hinschreiben", "Zahlen einsetzen", "nach der gesuchten Größe umstellen", "ausrechnen"]}, "einh": {"k": "list", "items": [["Länge", "cm"], ["Fläche", "cm^{2}"], ["Volumen", "cm^{3}"], ["1 Liter", "1000 cm^{3}"]]}, "kreis": {"k": "list", "items": [["Flächeninhalt", "A = π·r^{2}"], ["Umfang", "U = 2·π·r"]]}, "fakt": {"k": "list", "items": [["Höhe ·2", "Volumen ·2"], ["Radius ·2 (Kegel, Zylinder)", "Volumen ·4"], ["Radius ·2 (Kugel)", "Volumen ·8, Oberfläche ·4"]]}}, "cards": [{"id": "g01", "t": "g", "q": "Wie heißt dieser Körper?", "a": "Prisma", "mc": {"o": ["Prisma", "Pyramide", "Quader", "Kegel"]}, "g": "prisma", "gq": true, "z": "Genauer: ein Dreiecksprisma. Grund- und Deckfläche sind zwei gleiche Dreiecke, der Mantel besteht aus drei Rechtecken. Ergänzung, steht so nicht auf den Blättern.", "h": ["Grund- und Deckfläche sind gleich und liegen sich gegenüber.", "Er läuft nicht in einer Spitze zusammen."]}, {"id": "g02", "t": "g", "q": "Zu welchem Körper gehört dieses Netz?", "a": "Kegel", "mc": {"o": ["Kegel", "Zylinder", "Pyramide", "Kugel"]}, "g": "nkeg", "gq": true, "x": "Der Mantel ist ein Kreisausschnitt, die Grundfläche ein Kreis.", "h": ["Achte auf die Form des Mantels: Rechteck, Dreiecke oder Kreisausschnitt?"]}, {"id": "g03", "t": "g", "q": "Zu welchem Körper gehört dieses Netz?", "a": "(Quadratische) Pyramide", "mc": {"o": ["Quadratische Pyramide", "Kegel", "Quader", "Prisma"]}, "g": "npyr", "gq": true, "x": "Das Netz besteht aus der Grundfläche G (Quadrat) und vier gleichen Dreiecken (Mantel M).", "w": "Woran erkennst du ein Netz, das sich NICHT zu einer Pyramide falten lässt?"}, {"id": "g04", "t": "g", "q": "Zu welchem Körper gehört dieses Netz?", "a": "Zylinder", "mc": {"o": ["Zylinder", "Kegel", "Quader", "Kugel"]}, "g": "nzyl", "gq": true, "x": "Zwei Kreise (Grund- und Deckfläche) und ein Rechteck (Mantel)."}, {"id": "g05", "t": "g", "q": "Zylinder-Netz: Wie lang und wie breit ist das Mantel-Rechteck?", "a": "Länge = Umfang des Kreises (2·π·r), Breite = Höhe h", "mc": {"q": "Wie lang ist das Mantel-Rechteck eines Zylinders?", "o": ["2·π·r (Umfang des Kreises)", "π·r^{2}", "2·r (Durchmesser)", "die Höhe h"]}, "g": "nzyl", "x": "Beispiel vom Blatt: r = 3 cm → Länge = 2·π·3 ≈ 18,85 cm."}, {"id": "g06", "t": "g", "q": "Kegel-Netz: Wie lang ist der Bogen des Mantels?", "a": "So lang wie der Umfang des Grundkreises: 2·π·r", "mc": {"o": ["2·π·r (Umfang des Grundkreises)", "π·r·s", "2·π·s", "π·r^{2}"]}, "g": "nkeg", "w": "Warum muss der Bogen genau so lang sein wie der Umfang des Grundkreises?"}, {"id": "g07", "t": "g", "q": "Was ist die Mantellinie s beim Kegel?", "a": "Die Länge an der Seite des Kegels – nicht die Körperhöhe h. Du berechnest sie mit Pythagoras.", "mc": {"q": "Welche Strecke ist die Mantellinie s?", "o": ["Die Länge an der Seite des Kegels", "Die Körperhöhe von der Spitze senkrecht nach unten", "Der Durchmesser der Grundfläche", "Der Umfang des Grundkreises"]}, "g": "kegel", "z": "s reicht von der Spitze bis zum Rand des Grundkreises. Ergänzung, steht so nicht auf den Blättern.", "h": ["Sie ist länger als die Höhe h."]}, {"id": "g08", "t": "g", "q": "Was ist h_{a} bei der Pyramide?", "a": "Die Höhe eines Seitendreiecks – nicht die Körperhöhe h. Du berechnest sie mit Pythagoras.", "mc": {"q": "Was bedeutet h_{a} bei der Pyramide?", "o": ["Höhe eines Seitendreiecks", "Körperhöhe der Pyramide", "Länge der Grundkante", "Höhe der Grundfläche"]}, "g": "pyramide", "h": ["Sie liegt außen auf einer Seitenfläche."]}, {"id": "g09", "t": "g", "q": "Woraus besteht die Oberfläche einer Pyramide und eines Kegels?", "a": "Aus der Grundfläche G und dem Mantel M: O = G + M", "mc": {"q": "Welche Formel gilt für die Oberfläche von Pyramide und Kegel?", "o": ["O = G + M", "O = 2·G + M", "O = G · M", "O = ⅓ · G · h"]}, "x": "Pyramide: Mantel = vier gleiche Dreiecke. Kegel: Mantel = Kreisausschnitt.", "w": "Warum hat der Zylinder 2·G, Kegel und Pyramide aber nur 1·G?"}, {"id": "g10", "t": "g", "q": "In welcher Einheit steht ein Volumen, in welcher eine Fläche (bei Längen in cm)?", "a": "Volumen → cm^{3}, Fläche → cm^{2}", "mc": {"q": "Du berechnest eine Oberfläche, alle Längen sind in cm. Welche Einheit hat das Ergebnis?", "o": ["cm^{2}", "cm^{3}", "cm", "Liter"]}, "g": "einh", "hl": 1}, {"id": "g11", "t": "g", "q": "Wie viel Liter sind 7200 cm^{3}?", "a": "7,2 Liter", "mc": {"o": ["7,2 Liter", "72 Liter", "0,72 Liter", "720 Liter"]}, "g": "einh", "hl": 3, "x": "1 Liter = 1000 cm^{3}, also durch 1000 teilen.", "z": "1 Liter = 1 dm^{3}. Ergänzung, steht so nicht auf den Blättern.", "h": ["Wie viele cm^{3} sind 1 Liter?"]}, {"id": "g12", "t": "g", "q": "Kreis mit Radius r: Wie berechnest du Flächeninhalt A und Umfang U?", "a": "A = π·r^{2} und U = 2·π·r", "mc": {"q": "Welche Formel gibt den Umfang eines Kreises an?", "o": ["U = 2·π·r", "U = π·r^{2}", "U = 2·π·r^{2}", "U = π·r"]}, "g": "kreis"}, {"id": "g13", "t": "g", "q": "Finde den Fehler: „O = 2·π·3^{2} + 2·π·3·12 = 282,7 cm^{3}“", "a": "Die Einheit ist falsch: Eine Oberfläche ist eine Fläche, also cm^{2}.", "mc": {"o": ["Die Einheit: Es muss cm^{2} heißen.", "Die Formel: Es fehlt ein ⅓.", "Die Zahl: 282,7 ist falsch gerechnet.", "Es ist kein Fehler drin."]}, "x": "Die Zahl 282,7 stimmt. In der Arbeit kostet eine falsche Einheit trotzdem Punkte.", "g": "einh", "hl": 1}, {"id": "g14", "t": "g", "q": "Warum gibt es kein Netz der Kugel?", "a": "Die Oberfläche einer Kugel lässt sich nicht in der Ebene abwickeln.", "mc": {"q": "Von welchem Körper kann man kein Netz zeichnen?", "o": ["Kugel", "Kegel", "Zylinder", "Pyramide"]}, "g": "kugel"}, {"id": "q01", "t": "qz", "q": "Volumen eines Quaders (Länge a, Breite b, Höhe c)?", "a": "V = a · b · c", "mc": {"o": ["V = a · b · c", "V = 2·(a·b + a·c + b·c)", "V = ⅓ · a · b · c", "V = a + b + c"]}, "g": "quader", "x": "Beispiel vom Blatt: 5 · 3 · 2 = 30 cm^{3}."}, {"id": "q02", "t": "qz", "q": "Oberfläche eines Quaders?", "a": "O = 2 · (a·b + a·c + b·c)", "mc": {"o": ["O = 2 · (a·b + a·c + b·c)", "O = a·b + a·c + b·c", "O = a · b · c", "O = 2 · (a + b + c)"]}, "g": "quader", "x": "Alle Flächen aus dem Netz zusammenzählen: Jede der drei Flächen gibt es zweimal. Beispiel vom Blatt: 2·(15 + 10 + 6) = 62 cm^{2}.", "h": ["Der Quader hat 6 Flächen, je zwei sind gleich."], "w": "Welche drei Produkte kommen in die Klammer – und warum nicht zweimal dasselbe?"}, {"id": "q03", "t": "qz", "q": "Volumen eines Zylinders?", "a": "V = π · r^{2} · h  (Grundfläche mal Höhe)", "mc": {"o": ["V = π · r^{2} · h", "V = ⅓ · π · r^{2} · h", "V = 2 · π · r · h", "V = π · r · h"]}, "g": "zylinder", "x": "Beispiel vom Blatt: π · 3^{2} · 10 = 90π ≈ 282,7 cm^{3}."}, {"id": "q04", "t": "qz", "q": "Oberfläche eines Zylinders?", "a": "O = 2 · π · r^{2} + 2 · π · r · h  (zwei Kreise + Mantel)", "mc": {"o": ["O = 2·π·r^{2} + 2·π·r·h", "O = π·r^{2} + 2·π·r·h", "O = π·r^{2} + π·r·s", "O = 4·π·r^{2}"]}, "g": "zylinder", "x": "Beispiel vom Blatt: 18π + 60π = 78π ≈ 245,0 cm^{2}.", "h": ["Zwei Kreise und ein Rechteck."]}, {"id": "q05", "t": "qz", "q": "Etikett einer Dose: Welche Fläche ist das und wie berechnest du sie?", "a": "Nur der Mantel: M = 2 · π · r · h", "mc": {"q": "Mantelfläche eines Zylinders?", "o": ["M = 2 · π · r · h", "M = π · r · s", "M = π · r^{2} · h", "M = 2 · π · r^{2}"]}, "g": "nzyl", "x": "Der Mantel ist ein Rechteck: Länge = Umfang 2·π·r, Breite = h."}, {"id": "q06", "t": "qz", "q": "Wie viel Blech braucht man für eine ganze Dose – Volumen, Mantel oder Oberfläche?", "a": "Die ganze Oberfläche: zwei Kreise + Mantel", "mc": {"o": ["Oberfläche (zwei Kreise + Mantel)", "Nur den Mantel", "Das Volumen", "Nur die Grundfläche"]}, "w": "Woran erkennst du im Aufgabentext, ob Volumen oder Oberfläche gefragt ist? (hineinpassen ↔ Material außen herum)"}, {"id": "p01", "t": "py", "q": "Volumen einer Pyramide?", "a": "V = ⅓ · G · h", "mc": {"o": ["V = ⅓ · G · h", "V = G · h", "V = ½ · G · h", "V = ⅓ · G · h_{a}"]}, "g": "pyramide", "x": "Bei quadratischer Grundfläche ist G = a · a.", "h": ["Vergleiche mit dem Quader mit gleicher Grundfläche und Höhe."]}, {"id": "p02", "t": "py", "q": "Welchen Anteil eines Quaders mit gleicher Grundfläche und gleicher Höhe füllt die Pyramide?", "a": "Genau ⅓", "mc": {"o": ["Genau ⅓", "Genau ½", "Genau ⅔", "Genau ¼"]}, "w": "Wie oft musst du die Pyramide mit Sand füllen, um den Quader voll zu bekommen?"}, {"id": "p03", "t": "py", "q": "Gilt V = ⅓ · G · h nur für quadratische Pyramiden?", "a": "Nein – die Formel gilt für Pyramiden mit jeder Grundfläche.", "mc": {"o": ["Sie gilt für jede Grundfläche.", "Nur für quadratische Grundflächen.", "Nur für rechteckige Grundflächen.", "Nur wenn h = a ist."]}, "z": "Bei rechteckiger Grundfläche ist G = a · b. Ergänzung, steht so nicht auf den Blättern."}, {"id": "p04", "t": "py", "q": "Mantelfläche einer quadratischen Pyramide?", "a": "M = 4 · ½ · a · h_{a}", "mc": {"o": ["M = 4 · ½ · a · h_{a}", "M = 4 · ½ · a · h", "M = ½ · a · h_{a}", "M = 4 · a · h_{a}"]}, "g": "npyr", "x": "Vier gleiche Dreiecke, jedes mit Grundseite a und Höhe h_{a}.", "h": ["Flächeninhalt eines Dreiecks: ½ · Grundseite · Höhe."]}, {"id": "p05", "t": "py", "q": "Wie berechnest du die Seitenhöhe h_{a} einer quadratischen Pyramide?", "a": "h_{a} = √((a/2)^{2} + h^{2})  (Pythagoras)", "mc": {"o": ["h_{a} = √((a/2)^{2} + h^{2})", "h_{a} = √(a^{2} + h^{2})", "h_{a} = √(h^{2} − (a/2)^{2})", "h_{a} = a/2 + h"]}, "g": "pyramide", "x": "Beispiel vom Blatt: a = 8, h = 12 → √(4^{2} + 12^{2}) = √160 ≈ 12,65 cm.", "h": ["Rechtwinkliges Dreieck im Inneren: Körperhöhe h, halbe Grundkante, Seitenhöhe."], "w": "Warum steht im Dreieck a/2 und nicht a?"}, {"id": "p06", "t": "py", "q": "In welcher Reihenfolge berechnest du die Oberfläche einer Pyramide?", "a": "1. Seitenhöhe h_{a} (Pythagoras), 2. Mantelfläche M, 3. Oberfläche O = G + M", "mc": {"q": "Was berechnest du bei der Oberfläche einer Pyramide zuerst?", "o": ["Die Seitenhöhe h_{a} mit Pythagoras", "Das Volumen", "Den Umfang der Grundfläche", "Die Mantellinie s"]}, "g": "opyr", "hl": 0}, {"id": "p07", "t": "py", "q": "Finde den Fehler: Pyramide mit a = 6 cm, h = 4 cm. „M = 4 · ½ · 6 · 4 = 48 cm^{2}“", "a": "Es wurde die Körperhöhe h eingesetzt. Für den Mantel braucht man die Seitenhöhe h_{a}.", "mc": {"o": ["Statt h_{a} wurde die Körperhöhe h eingesetzt.", "Die Einheit müsste cm^{3} sein.", "Es fehlt ein ⅓.", "Es sind nur drei Dreiecke."]}, "z": "Richtig: h_{a} = √(3^{2} + 4^{2}) = 5 cm, M = 4 · ½ · 6 · 5 = 60 cm^{2}. Berechnet – bitte prüfen.", "g": "pyramide"}, {"id": "k01", "t": "ke", "q": "Volumen eines Kegels?", "a": "V = ⅓ · π · r^{2} · h", "mc": {"o": ["V = ⅓ · π · r^{2} · h", "V = π · r^{2} · h", "V = ⅓ · π · r · s", "V = 4/3 · π · r^{3}"]}, "g": "kegel", "x": "V = ⅓ · G · h mit kreisförmiger Grundfläche G = π · r^{2}. Beispiel vom Blatt: ⅓ · π · 3^{2} · 4 ≈ 37,7 cm^{3}."}, {"id": "k02", "t": "ke", "q": "Sandexperiment: Wie viele volle Kegel füllen einen Zylinder mit gleichem Radius und gleicher Höhe?", "a": "3 Kegel voll = 1 Zylinder. Der Kegel füllt genau ⅓ des Zylinders.", "mc": {"o": ["3", "2", "4", "1,5"]}, "w": "Welcher Körper verhält sich zum Quader so wie der Kegel zum Zylinder?"}, {"id": "k03", "t": "ke", "q": "Mantelfläche eines Kegels?", "a": "M = π · r · s", "mc": {"o": ["M = π · r · s", "M = π · r · h", "M = 2 · π · r · s", "M = π · r^{2} · s"]}, "g": "nkeg", "x": "s ist die Mantellinie, nicht die Höhe h. Beispiel vom Blatt: π · 3 · 5 ≈ 47,12 cm^{2}."}, {"id": "k04", "t": "ke", "q": "Wie berechnest du die Mantellinie s eines Kegels?", "a": "s = √(r^{2} + h^{2})  (Pythagoras)", "mc": {"o": ["s = √(r^{2} + h^{2})", "s = √(h^{2} − r^{2})", "s = r + h", "s = √((r/2)^{2} + h^{2})"]}, "g": "kegel", "x": "Beispiel vom Blatt: r = 3, h = 4 → s = √(3^{2} + 4^{2}) = 5 cm.", "h": ["Rechtwinkliges Dreieck aus r, h und s."]}, {"id": "k05", "t": "ke", "q": "Oberfläche eines Kegels?", "a": "O = G + M = π · r^{2} + π · r · s", "mc": {"o": ["O = π·r^{2} + π·r·s", "O = 2·π·r^{2} + π·r·s", "O = π·r^{2} + 2·π·r·h", "O = π·r^{2} + π·r·h"]}, "g": "okeg", "hl": 3, "x": "Beispiel vom Blatt: 28,27 cm^{2} + 47,12 cm^{2} ≈ 75,4 cm^{2}."}, {"id": "k06", "t": "ke", "q": "Welche Form hat der Mantel eines Kegels im Netz?", "a": "Ein Kreisausschnitt", "mc": {"o": ["Kreisausschnitt", "Rechteck", "Dreieck", "Ganzer Kreis"]}, "g": "nkeg"}, {"id": "k07", "t": "ke", "q": "In welcher Reihenfolge berechnest du die Oberfläche eines Kegels?", "a": "Zuerst s (Pythagoras), dann G und M, zum Schluss O = G + M", "mc": {"q": "Was brauchst du für die Oberfläche eines Kegels zuerst, wenn r und h gegeben sind?", "o": ["Die Mantellinie s", "Das Volumen", "Die Seitenhöhe h_{a}", "Den Durchmesser"]}, "g": "okeg", "hl": 0}, {"id": "u01", "t": "ku", "q": "Volumen einer Kugel?", "a": "V = 4/3 · π · r^{3}", "mc": {"o": ["V = 4/3 · π · r^{3}", "V = 4 · π · r^{2}", "V = 4/3 · π · r^{2}", "V = ⅓ · π · r^{3}"]}, "g": "kugel", "x": "Beispiel vom Blatt: 4/3 · π · 4^{3} ≈ 268,1 cm^{3}.", "h": ["Volumen → hoch 3."]}, {"id": "u02", "t": "ku", "q": "Oberfläche einer Kugel?", "a": "O = 4 · π · r^{2}", "mc": {"o": ["O = 4 · π · r^{2}", "O = 4/3 · π · r^{3}", "O = 2 · π · r^{2}", "O = 4 · π · r^{3}"]}, "g": "kugel", "x": "Beispiel vom Blatt: 4 · π · 4^{2} ≈ 201,1 cm^{2}.", "h": ["Fläche → hoch 2."]}, {"id": "u03", "t": "ku", "q": "Welchen Anteil des umfassenden Zylinders füllt eine Kugel?", "a": "Zwei Drittel des Volumens des umfassenden Zylinders", "mc": {"o": ["Zwei Drittel", "Ein Drittel", "Die Hälfte", "Drei Viertel"]}, "z": "Der umfassende Zylinder hat den Radius r und die Höhe 2·r. Ergänzung, steht so nicht auf den Blättern."}, {"id": "u04", "t": "ku", "q": "Ein Fußball hat einen Durchmesser von 22 cm. Welche Zahl setzt du in die Kugelformeln ein?", "a": "Den Radius: 11 cm", "mc": {"o": ["11 cm", "22 cm", "44 cm", "5,5 cm"]}, "x": "Erst den Durchmesser halbieren – in den Formeln steht immer r.", "w": "Um welchen Faktor wäre das Volumen falsch, wenn du mit 22 statt 11 rechnest?"}, {"id": "u05", "t": "ku", "q": "Finde den Fehler: Kugel mit r = 5 cm. „O = 4/3 · π · 5^{3} ≈ 523,6 cm^{2}“", "a": "Es wurde die Volumenformel benutzt. Oberfläche: O = 4 · π · r^{2}.", "mc": {"o": ["Es wurde die Volumenformel benutzt.", "Der Radius wurde nicht halbiert.", "π wurde vergessen.", "Es ist kein Fehler drin."]}, "z": "Richtig: O = 4 · π · 5^{2} ≈ 314,2 cm^{2}. Berechnet – bitte prüfen."}, {"id": "z01", "t": "zs", "q": "Eine Eiswaffel besteht aus einem Kegel mit einer Halbkugel obendrauf. Wie bestimmst du das Gesamtvolumen?", "a": "Kegel und Halbkugel einzeln berechnen und die beiden Volumen addieren.", "mc": {"o": ["Volumen von Kegel und Halbkugel addieren", "Volumen von Kegel und ganzer Kugel addieren", "Volumen des Kegels verdoppeln", "Volumen der Halbkugel vom Kegel abziehen"]}, "g": "eis", "z": "Der Rechenweg ist aus der Checklisten-Aufgabe abgeleitet. Ergänzung, steht so nicht auf den Blättern."}, {"id": "z02", "t": "zs", "q": "Wie groß ist das Volumen einer Halbkugel mit Radius r?", "a": "Die Hälfte des Kugelvolumens: V = ½ · 4/3 · π · r^{3}", "mc": {"o": ["½ · 4/3 · π · r^{3}", "4/3 · π · r^{3}", "½ · 4 · π · r^{2}", "⅓ · π · r^{3}"]}, "g": "eis", "z": "Zusammengefasst: V = ⅔ · π · r^{3}. Berechnet – bitte prüfen."}, {"id": "z03", "t": "zs", "q": "Oberfläche eines zusammengesetzten Körpers: Welche Flächen zählen?", "a": "Nur die Flächen, die außen liegen. Flächen, an denen die Teilkörper zusammenstoßen, zählen nicht.", "mc": {"q": "Eiswaffel (Kegel + Halbkugel): Welche Flächen gehören zur Oberfläche?", "o": ["Kegelmantel + halbe Kugeloberfläche", "Kegelmantel + Grundkreis + halbe Kugeloberfläche", "Kegelmantel + ganze Kugeloberfläche", "Nur der Kegelmantel"]}, "g": "eis", "z": "Ergänzung, steht so nicht auf den Blättern."}, {"id": "z04", "t": "zs", "q": "Wie gehst du bei einem zusammengesetzten Körper vor?", "a": "In Teilkörper zerlegen, jeden Teilkörper einzeln berechnen, dann zusammenrechnen.", "mc": {"q": "Was ist der erste Schritt bei einem zusammengesetzten Körper?", "o": ["In bekannte Teilkörper zerlegen", "Alle Längen addieren", "Die Oberfläche des größten Teils berechnen", "Den Radius verdoppeln"]}, "g": "turm", "z": "Ergänzung, steht so nicht auf den Blättern."}, {"id": "v01", "t": "um", "q": "Bei einem Kegel wird die Höhe verdoppelt, der Radius bleibt gleich. Wie verändert sich das Volumen?", "a": "Das Volumen verdoppelt sich.", "mc": {"o": ["Es verdoppelt sich.", "Es vervierfacht sich.", "Es verachtfacht sich.", "Es bleibt gleich."]}, "g": "fakt", "hl": 0, "x": "h steht in V = ⅓ · π · r^{2} · h nur einmal (nicht quadriert).", "z": "Checkliste: r = 3 cm, h = 4 cm → 37,7 cm^{3}; mit h = 8 cm → 75,4 cm^{3}. Berechnet – bitte prüfen."}, {"id": "v02", "t": "um", "q": "Bei einem Kegel wird der Radius verdoppelt, die Höhe bleibt gleich. Wie verändert sich das Volumen?", "a": "Das Volumen vervierfacht sich.", "mc": {"o": ["Es vervierfacht sich.", "Es verdoppelt sich.", "Es verachtfacht sich.", "Es versechsfacht sich."]}, "g": "fakt", "hl": 1, "x": "r steht im Quadrat: (2·r)^{2} = 4·r^{2}.", "z": "Berechnet – bitte prüfen."}, {"id": "v03", "t": "um", "q": "Bei einer Kugel wird der Radius verdoppelt. Wie verändern sich Volumen und Oberfläche?", "a": "Das Volumen wird 8-mal so groß, die Oberfläche 4-mal so groß.", "mc": {"q": "Kugel: Der Radius wird verdoppelt. Wie verändert sich das Volumen?", "o": ["Es wird 8-mal so groß.", "Es wird 4-mal so groß.", "Es wird 2-mal so groß.", "Es wird 6-mal so groß."]}, "g": "fakt", "hl": 2, "x": "Volumen: (2·r)^{3} = 8·r^{3}. Oberfläche: (2·r)^{2} = 4·r^{2}.", "z": "Berechnet – bitte prüfen."}, {"id": "v04", "t": "um", "q": "Bei einer quadratischen Pyramide wird die Grundkante verdoppelt, die Höhe bleibt gleich. Wie verändert sich das Volumen?", "a": "Das Volumen vervierfacht sich.", "mc": {"o": ["Es vervierfacht sich.", "Es verdoppelt sich.", "Es verachtfacht sich.", "Es bleibt gleich."]}, "x": "G = a · a: Aus (2·a)·(2·a) wird 4·a^{2}.", "z": "Berechnet – bitte prüfen."}, {"id": "v05", "t": "um", "q": "Kegel: V und r sind gegeben, h ist gesucht. Wie stellst du V = ⅓ · π · r^{2} · h nach h um?", "a": "h = 3 · V : (π · r^{2})", "mc": {"o": ["h = 3·V : (π·r^{2})", "h = V : (3·π·r^{2})", "h = V : (π·r^{2})", "h = 3·V · π·r^{2}"]}, "g": "umk", "hl": 2, "x": "Erst mal 3, dann durch π · r^{2} teilen.", "z": "Checkliste: V = 100 cm^{3}, r = 4 cm → h = 300 : (π · 16) ≈ 5,97 cm. Berechnet – bitte prüfen."}, {"id": "v06", "t": "um", "q": "Zylinder: V und r sind gegeben, h ist gesucht. Wie rechnest du?", "a": "h = V : (π · r^{2})", "mc": {"o": ["h = V : (π·r^{2})", "h = 3·V : (π·r^{2})", "h = V · π·r^{2}", "h = V : (2·π·r)"]}, "g": "umk", "hl": 2, "z": "Berechnet – bitte prüfen."}, {"id": "v07", "t": "um", "q": "Quadratische Pyramide: V und a sind gegeben, h ist gesucht. Wie rechnest du?", "a": "h = 3 · V : a^{2}", "mc": {"o": ["h = 3·V : a^{2}", "h = V : a^{2}", "h = V : (3·a^{2})", "h = 3·V : a"]}, "g": "umk", "hl": 2, "z": "Berechnet – bitte prüfen."}, {"id": "v08", "t": "um", "q": "Welche Schritte gehst du bei einer Umkehraufgabe (Volumen gegeben, Höhe oder Radius gesucht)?", "a": "Formel hinschreiben, Zahlen einsetzen, nach der gesuchten Größe umstellen, ausrechnen.", "mc": {"q": "Umkehraufgabe: Was machst du zuerst?", "o": ["Die passende Formel hinschreiben", "Das Volumen mal 3 nehmen", "Den Radius verdoppeln", "Die Wurzel ziehen"]}, "g": "umk", "hl": 0, "z": "Ergänzung, steht so nicht auf den Blättern."}], "match": [{"n": "Körper ↔ Volumen", "p": [["Quader", "a · b · c"], ["Zylinder", "π · r^{2} · h"], ["Quadratische Pyramide", "⅓ · a^{2} · h"], ["Kegel", "⅓ · π · r^{2} · h"], ["Kugel", "4/3 · π · r^{3}"]]}, {"n": "Körper ↔ Oberfläche", "p": [["Quader", "2 · (a·b + a·c + b·c)"], ["Zylinder", "2·π·r^{2} + 2·π·r·h"], ["Kegel", "π·r^{2} + π·r·s"], ["Kugel", "4 · π · r^{2}"], ["Quadratische Pyramide", "a^{2} + 4 · ½ · a · h_{a}"]]}, {"n": "Zeichen ↔ Bedeutung", "p": [["s", "Mantellinie des Kegels"], ["h_{a}", "Höhe eines Seitendreiecks"], ["h", "Körperhöhe"], ["G", "Grundfläche"], ["M", "Mantelfläche"], ["r", "Radius"]]}, {"n": "Körper ↔ Netz", "p": [["Zylinder", "Rechteck + zwei Kreise"], ["Kegel", "Kreisausschnitt + Kreis"], ["Quadratische Pyramide", "Quadrat + vier gleiche Dreiecke"], ["Quader", "sechs Rechtecke"]]}, {"n": "Mantel ↔ Formel", "p": [["Mantel Zylinder", "2 · π · r · h"], ["Mantel Kegel", "π · r · s"], ["Mantel Pyramide", "4 · ½ · a · h_{a}"], ["Mantellinie s", "√(r^{2} + h^{2})"], ["Seitenhöhe h_{a}", "√((a/2)^{2} + h^{2})"]]}], "tasks": [{"id": "quader-v", "t": "qz", "n": "Quader: Volumen in Litern", "g": "quader", "q": "Ein Karton ist [a] cm lang, [b] cm breit und [c] cm hoch. Wie viel Liter passen hinein?", "sets": [{"a": 30, "b": 20, "c": 12}, {"a": 40, "b": 25, "c": 10}, {"a": 50, "b": 30, "c": 20}, {"a": 24, "b": 15, "c": 10}, {"a": 35, "b": 20, "c": 16}], "tip": "1 Liter = 1000 cm^{3}. Von cm^{3} in Liter: durch 1000 teilen.", "steps": [{"k": "pick", "q": "Welche Formel brauchst du?", "o": ["V = a · b · c", "O = 2 · (a·b + a·c + b·c)", "V = ⅓ · a · b · c", "V = π · r^{2} · h"]}, {"k": "num", "q": "Volumen V", "f": "a*b*c", "u": "cm³", "as": "V", "w": "V = a · b · c = [a] · [b] · [c]", "final": true, "err": [{"f": "2*(a*b+a*c+b*c)", "m": "Das ist die Oberfläche. Für „hineinpassen“ brauchst du das Volumen."}]}, {"k": "num", "q": "Volumen in Litern", "f": "V/1000", "u": "Liter", "uo": ["cm²", "cm³", "Liter"], "w": "[V] cm^{3} : 1000", "final": true, "err": [{"f": "V", "m": "Das sind noch cm^{3}. Für Liter durch 1000 teilen."}]}]}, {"id": "quader-o", "t": "qz", "n": "Quader: Oberfläche", "g": "quader", "q": "Ein Karton ist [a] cm lang, [b] cm breit und [c] cm hoch. Wie viel Pappe braucht man für den Karton (ohne Laschen)?", "sets": [{"a": 30, "b": 20, "c": 12}, {"a": 40, "b": 25, "c": 10}, {"a": 50, "b": 30, "c": 20}, {"a": 24, "b": 15, "c": 10}, {"a": 35, "b": 20, "c": 16}], "tip": "In die Klammer gehören a·b, a·c und b·c – drei verschiedene Flächen, jede gibt es zweimal.", "steps": [{"k": "pick", "q": "Welche Formel brauchst du?", "o": ["O = 2 · (a·b + a·c + b·c)", "V = a · b · c", "O = a·b + a·c + b·c", "O = 2·π·r^{2} + 2·π·r·h"]}, {"k": "num", "q": "Oberfläche O", "f": "2*(a*b+a*c+b*c)", "u": "cm²", "w": "O = 2 · ([a]·[b] + [a]·[c] + [b]·[c])", "final": true, "err": [{"f": "a*b+a*c+b*c", "m": "Du hast das „2 ·“ vergessen – jede Fläche gibt es zweimal."}, {"f": "a*b*c", "m": "Das ist das Volumen. Pappe außen herum = Oberfläche."}, {"f": "2*(a*b+a*c+a*c)", "m": "Ein Produkt steht doppelt da. Es müssen a·b, a·c und b·c sein."}, {"f": "2*(a*b+b*c+b*c)", "m": "Ein Produkt steht doppelt da. Es müssen a·b, a·c und b·c sein."}]}]}, {"id": "zyl-v", "t": "qz", "n": "Zylinder: Volumen in cm³ und Litern", "g": "zylinder", "q": "Eine Dose hat den Radius r = [r] cm und die Höhe h = [h] cm. Wie viel Saft passt hinein (in cm^{3} und in Liter)?", "sets": [{"r": 3, "h": 12}, {"r": 4, "h": 10}, {"r": 5, "h": 8}, {"r": 6, "h": 15}, {"r": 3.5, "h": 11}], "tip": "Grundfläche mal Höhe: V = π · r^{2} · h.", "steps": [{"k": "pick", "q": "Welche Formel brauchst du?", "o": ["V = π · r^{2} · h", "V = a · b · c", "V = ⅓ · G · h", "V = ⅓ · π · r^{2} · h"]}, {"k": "num", "q": "Volumen V", "f": "pi*r^2*h", "u": "cm³", "as": "V", "w": "V = π · r^{2} · h = π · [r]^{2} · [h]", "final": true, "err": [{"f": "pi*r*h", "m": "Der Radius muss quadriert werden: r^{2}."}, {"f": "2*pi*r*h", "m": "Das ist die Mantelfläche, nicht das Volumen."}, {"f": "pi*r^2*h/3", "m": "Das ⅓ gehört zum Kegel, nicht zum Zylinder."}, {"f": "pi*(2*r)^2*h", "m": "Du hast mit dem Durchmesser gerechnet. In der Formel steht der Radius."}]}, {"k": "num", "q": "Volumen in Litern", "f": "V/1000", "u": "Liter", "uo": ["cm²", "cm³", "Liter"], "w": "[V] cm^{3} : 1000", "final": true, "err": [{"f": "V", "m": "Das sind noch cm^{3}. Für Liter durch 1000 teilen."}]}]}, {"id": "zyl-o", "t": "qz", "n": "Zylinder: Mantel und Oberfläche", "g": "zylinder", "q": "Eine Dose hat den Radius r = [r] cm und die Höhe h = [h] cm. Wie groß ist das Etikett (nur der Mantel) und wie viel Blech braucht man für die ganze Dose?", "sets": [{"r": 3, "h": 12}, {"r": 4, "h": 10}, {"r": 5, "h": 8}, {"r": 6, "h": 15}, {"r": 3.5, "h": 11}], "tip": "Die Dose hat zwei Kreise (Boden und Deckel) und einen Mantel.", "steps": [{"k": "num", "q": "Etikett: Mantelfläche M", "f": "2*pi*r*h", "u": "cm²", "as": "M", "w": "M = 2 · π · r · h = 2 · π · [r] · [h]", "final": true, "err": [{"f": "pi*r*h", "m": "Das „2 ·“ fehlt: Der Umfang ist 2 · π · r."}, {"f": "pi*r^2*h", "m": "Das ist das Volumen. Der Mantel ist ein Rechteck: Umfang mal Höhe."}]}, {"k": "num", "q": "Ein Kreis: Grundfläche G", "f": "pi*r^2", "u": "cm²", "as": "G", "w": "G = π · r^{2} = π · [r]^{2}", "err": [{"f": "2*pi*r", "m": "Das ist der Umfang. Flächeninhalt des Kreises: π · r^{2}."}]}, {"k": "num", "q": "Ganze Dose: Oberfläche O", "f": "2*G+M", "u": "cm²", "w": "O = 2 · G + M = 2 · [G] + [M]", "final": true, "err": [{"f": "G+M", "m": "Die Dose hat zwei Kreise: Boden und Deckel."}, {"f": "M", "m": "Das ist nur der Mantel. Es fehlen die beiden Kreise."}]}]}, {"id": "pyr-v", "t": "py", "n": "Pyramide: Volumen", "g": "pyramide", "q": "Eine quadratische Pyramide hat die Grundkante a = [a] cm und die Höhe h = [h] cm. Berechne das Volumen.", "sets": [{"a": 6, "h": 4}, {"a": 8, "h": 12}, {"a": 6, "h": 13}, {"a": 10, "h": 12}, {"a": 16, "h": 6}, {"a": 18, "h": 12}], "tip": "Die Pyramide füllt genau ⅓ des Quaders mit gleicher Grundfläche und Höhe.", "steps": [{"k": "pick", "q": "Welche Formel brauchst du?", "o": ["V = ⅓ · G · h", "V = a · b · c", "V = π · r^{2} · h", "V = ⅓ · π · r^{2} · h"]}, {"k": "num", "q": "Grundfläche G", "f": "a^2", "u": "cm²", "as": "G", "w": "G = a · a = [a] · [a]", "err": [{"f": "4*a", "m": "Das ist der Umfang des Quadrats. Flächeninhalt: a · a."}]}, {"k": "num", "q": "Volumen V", "f": "G*h/3", "u": "cm³", "w": "V = ⅓ · G · h = ⅓ · [G] · [h]", "final": true, "err": [{"f": "G*h", "m": "Du hast das ⅓ vergessen – so wäre es ein Quader."}, {"f": "a*h/3", "m": "Die Grundfläche ist a · a, nicht nur a."}, {"f": "G*h/2", "m": "Bei der Pyramide ist es ⅓, nicht ½."}]}]}, {"id": "pyr-o", "t": "py", "n": "Pyramide: Oberfläche", "g": "pyramide", "q": "Eine quadratische Pyramide hat die Grundkante a = [a] cm und die Höhe h = [h] cm. Berechne die Oberfläche.", "sets": [{"a": 6, "h": 4}, {"a": 8, "h": 12}, {"a": 6, "h": 13}, {"a": 10, "h": 12}, {"a": 16, "h": 6}, {"a": 18, "h": 12}], "tip": "Für den Mantel brauchst du die Seitenhöhe h_{a} – nicht die Körperhöhe h.", "steps": [{"k": "num", "q": "Seitenhöhe h_{a} (Pythagoras)", "f": "sqrt((a/2)^2+h^2)", "u": "cm", "as": "ha", "n": "h_{a}", "w": "h_{a} = √((a/2)^{2} + h^{2}) = √(([a]/2)^{2} + [h]^{2})", "err": [{"f": "sqrt(a^2+h^2)", "m": "Im Dreieck steht die halbe Grundkante: a/2."}, {"f": "(a/2)^2+h^2", "m": "Du musst noch die Wurzel ziehen."}, {"f": "a/2+h", "m": "Pythagoras: erst quadrieren, dann addieren, dann Wurzel ziehen."}]}, {"k": "num", "q": "Mantelfläche M", "f": "2*a*ha", "u": "cm²", "as": "M", "w": "M = 4 · ½ · a · h_{a} = 4 · ½ · [a] · [ha]", "err": [{"f": "a*ha/2", "m": "Das ist nur eines der vier Dreiecke."}, {"f": "2*a*h", "m": "Du hast die Körperhöhe h genommen. Für den Mantel brauchst du h_{a}."}, {"f": "4*a*ha", "m": "Das ½ fehlt: Dreiecksfläche = ½ · Grundseite · Höhe."}]}, {"k": "num", "q": "Grundfläche G", "f": "a^2", "u": "cm²", "as": "G", "w": "G = a · a = [a] · [a]"}, {"k": "num", "q": "Oberfläche O", "f": "G+M", "u": "cm²", "w": "O = G + M = [G] + [M]", "final": true, "err": [{"f": "M", "m": "Das ist nur der Mantel. Die Grundfläche G fehlt noch."}, {"f": "a^2+2*a*h", "m": "Du hast im Mantel die Körperhöhe h statt der Seitenhöhe h_{a} benutzt."}, {"f": "a^2*h/3", "m": "Das ist das Volumen. Gefragt ist die Oberfläche."}]}]}, {"id": "pyr-m", "t": "py", "n": "Pyramide: Zeltdach (nur Mantel)", "g": "pyramide", "q": "Ein Zelt hat die Form einer quadratischen Pyramide mit der Grundkante a = [a] m und der Höhe h = [h] m. Wie viel Stoff braucht man für die vier Seitenflächen (ohne Boden)?", "sets": [{"a": 4, "h": 1.5}, {"a": 6, "h": 4}, {"a": 3, "h": 2}, {"a": 8, "h": 3}, {"a": 2.4, "h": 1.6}], "tip": "„Ohne Boden“ heißt: nur der Mantel, die Grundfläche zählt nicht mit.", "steps": [{"k": "num", "q": "Seitenhöhe h_{a} (Pythagoras)", "f": "sqrt((a/2)^2+h^2)", "u": "m", "as": "ha", "n": "h_{a}", ": [{"f": "r^2+h^2", "m": "Du musst noch die Wurzel ziehen."}, {"f": "r+h", "m": "Pythagoras: erst quadrieren, dann addieren, dann Wurzel ziehen."}, {"f": "sqrt(h^2-r^2)", "m": "s ist die längste Seite im Dreieck: r^{2} + h^{2}, nicht minus."}]}, {"k": "num", "q": "Grundfläche G", "f": "pi*r^2", "u": "cm²", "as": "G", "w": "G = π · r^{2} = π · [r]^{2}", "err": [{"f": "2*pi*r", "m": "Das ist der Umfang. Flächeninhalt des Kreises: π · r^{2}."}]}, {"k": "num", "q": "Mantelfläche M", "f": "pi*r*s", "u": "cm²", "as": "M", "w": "M = π · r · s = π · [r] · [s]", "err": [{"f": "pi*r*h", "m": "Im Mantel steht die Mantellinie s, nicht die Höhe h."}, {"f": "2*pi*r*s", "m": "M = π · r · s – ohne die 2."}]}, {"k": "num", "q": "Oberfläche O", "f": "G+M", "u": "cm²", "w": "O = G + M = [G] + [M]", "final": true, "err": [{"f": "M", "m": "Das ist nur der Mantel. Die Grundfläche G fehlt noch."}, {"f": "2*G+M", "m": "Der Kegel hat nur einen Kreis – die Spitze hat keine Deckfläche."}, {"f": "pi*r^2+pi*r*h", "m": "Du hast im Mantel die Höhe h statt der Mantellinie s benutzt."}, {"f": "pi*r^2*h/3", "m": "Das ist das Volumen. Gefragt ist die Oberfläche."}]}]}, {"id": "kegel-sand", "t": "ke", "n": "Kegel: Sandhaufen (Durchmesser gegeben)", "g": "kegel", "q": "Ein Sandhaufen hat die Form eines Kegels (Durchmesser [d] m, Höhe [h] m). Wie viel Kubikmeter Sand sind es?", "sets": [{"d": 4, "h": 1.5}, {"d": 6, "h": 2}, {"d": 3, "h": 1.2}, {"d": 5, "h": 1.8}, {"d": 8, "h": 2.4}], "tip": "Durchmesser gegeben? Erst halbieren – in den Formeln steht der Radius.", "steps": [{"k": "num", "q": "Radius r", "f": "d/2", "u": "m", "as": "r", "n": "r", "w": "r = d : 2 = [d] : 2"}, {"k": "num", "q": "Volumen V", "f": "pi*r^2*h/3", "u": "m³", "w": "V = ⅓ · π · r^{2} · h = ⅓ · π · [r]^{2} · [h]", "final": true, "err": [{"f": "pi*d^2*h/3", "m": "Du hast mit dem Durchmesser gerechnet. Erst halbieren: r = d : 2."}, {"f": "pi*r^2*h", "m": "Du hast das ⅓ vergessen – das wäre der Zylinder."}]}]}, {"id": "kugel", "t": " der: Oberfläche O", "f": "4*pi*r^2", "u": "cm²", "w": "O = 4 · π · r^{2} = 4 · π · [r]^{2}", "final": true, "err": [{"f": "4*pi*d^2", "m": "Du hast mit dem Durchmesser gerechnet. Erst halbieren: r = d : 2."}, {"f": "4/3*pi*r^3", "m": "Das ist das Volumen. Oberfläche: 4 · π · r^{2}."}]}]}, {"id": "eis-v", "t": "zs", "n": "Eiswaffel: Gesamtvolumen (Kegel + Halbkugel)", "g": "eis", "q": "Eine Eiswaffel besteht aus einem Kegel (r = [r] cm, h = [h] cm) mit einer Halbkugel (r = [r] cm) obendrauf. Berechne das Gesamtvolumen.", "sets": [{"r": 3, "h": 8}, {"r": 4, "h": 10}, {"r": 2, "h": 6}, {"r": 5, "h": 12}, {"r": 2.5, "h": 9}], "tip": "Zerlegen, einzeln rechnen, addieren. Halbkugel = die Hälfte der Kugel.", "steps": [{"k": "num", "q": "Volumen des Kegels", "f": "pi*r^2*h/3", "u": "cm³", "as": "VK", "n": "V Kegel", "w": "V_{Kegel} = ⅓ · π · [r]^{2} · [h]", "err": [{"f": "pi*r^2*h", "m": "Du hast das ⅓ vergessen – das wäre der Zylinder."}]}, {"k": "num", "q": "Volumen der Halbkugel", "f": "2/3*pi*r^3", "u": "cm³", "as": "VH", "n": "V Halbkugel", "w": "V_{Halbkugel} = ½ · 4/3 · π · [r]^{3}", "err": [{"f": "4/3*pi*r^3", "m": "Das ist die ganze Kugel. Du brauchst nur die Hälfte."}]}, {"k": "num", "q": "Gesamtvolumen V", "f": "VK+VH", "u": "cm³", "w": "V = [VK] + [VH]", "final": true, "err": [{"f": "pi*r^2*h/3+4/3*pi*r^3", "m": "Du hast die ganze Kugel addiert. Auf der Waffel sitzt nur eine Halbkugel."}, {"f": "pi*r^2*h/3", "m": "Das ist nur der Kegel. Die Halbkugel fehlt noch."}]}]}, {"id": "turm-v", "t": "zs", "n": "Silo: Gesamtvolumen (Zylinder + Kegel)", "g": "turm", "q": "Ein Silo besteht aus einem Zylinder (r = [r] m, Höhe [h] m) mit einem Kegel als Dach (gleicher Radius, Höhe [k] m). Berechne das Gesamtvolumen.", "sets": [{"r": 2, "h": 5, "k": 3}, {"r": 3, "h": 6, "k": 2}, {"r": 4, "h": 10, "k": 6}, {"r": 1.5, "h": 4, "k": 2}, {"r": 2.5, "h": 8, "k": 3}], "tip": "Zylinder: π · r^{2} · h. Kegel: ⅓ davon mit seiner eigenen Höhe.", "steps": [{"k": "num", "q": "Volumen des Z function roundRobin(list){const g={},order=[];list.forEach(c=>{if(!g[c.t]){g[c.t]=[];order.push(c.t)}g[c.t].push(c)});const out=[];let more=true;while(more){more=false;order.forEach(t=>{if(g[t].length){out.push(g[t].shift());more=true}})}return out}
function activeFilter(){return (S.filter||[]).filter(id=>D.topics.some(t=>t.id===id))}
function filtered(){const f=activeFilter();return f.length?D.cards.filter(c=>f.includes(c.t)):D.cards}

function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(dayStr(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dayStr(d))){n++;d.setDate(d.getDate()-1)}return n}

const deDate=s=>s?s.split("-").reverse().join("."):"";
function examTime(){const e=examDate();return e?new Date(e+"T08:00").getTime():0}
function examInfo(){const e=examDate();if(!e)return"";const a=new Date(e+"T00:00"),b=new Date(today()+"T00:00");const d=Math.round((a-b)/864e5);if(d<0)return"";return d===0?"Arbeit heute":d===1?"Arbeit morgen":"Arbeit in "+d+" Tagen"}
function ivl(lv){const m=[1,5,30,240,1440,4320,10080][Math.min(lv,6)];const ex=examTime(),now=Date.now();if(ex>now){return Math.min(m,Math.max(5,(ex-now)/120000))}return m}
function stats(cards){const n=cards.length,now=Date.now();let sum=0,mast=0,due=0,seen=0;cards.forEach(c=>{const k=ck(c.id);sum+=Math.min(k.lv,4)/4;if(k.lv>=3)mast++;if(k.n>0){seen++;if(k.due<=now)due++}});return{n,mast,due,seen,pct:n?Math.round(sum/n*100):0,mastPct:n?Math.round(mast/n*100):0}}
const pctTxt=s=>s.seen?s.pct+" %":"–";
