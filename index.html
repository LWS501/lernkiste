<!DOCTYPE html>
<html lang="de">
<head>

<title>Lernkiste Geschichte</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning for a 14-year-old: friendly, focused, playful rewards
   IDEA a Karteikasten made from her own Geschichte notebook: ruled index cards with a red margin
   PICTURE the index card itself, large; its back carries a diagram with the answer highlighted
   COLOUR white paper, blue ink #1d2754, coral headline #e8664d, orange marker #f2911b; night = deep ink blue
   TYPE Nunito 800 + Nunito
   LAYOUT one phone column (max 560px): header pills, scrolling view, bottom tab bar; same column centred on a laptop */
:root{--bg:#fff;--ink:#1d2754;--mut:#5b6385;--line:#e1e6f6;--card:#fff;--rule:#dde5fa;--soft:#f3f5fd;--coral:#e8664d;--orange:#f2911b;--blue:#2f4fd1;--ok:#178a57;--bad:#cf3b31;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b{color:var(--coral)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.pill svg{width:15px;height:15px}
main{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:58px;background:none;border:0;color:var(--mut);font:700 12px Nunito,sans-serif;display:grid;place-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--coral)}
button{font:inherit;cursor:pointer}
.btn{min-height:46px;border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--blue);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.h{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:20px 0 8px;line-height:1.15}
.sub{color:var(--mut);font-size:14px}
.mt{margin-top:14px}
.nowrap{white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero{background:var(--coral);color:#fff;border-radius:22px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:6px}
.mascot{font-size:54px;width:86px;height:86px;display:grid;place-items:center;background:rgba(255,255,255,.22);border-radius:50%;line-height:1}
.hk{font-size:14px;font-weight:700;opacity:.92}
.hb{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:2px 0 8px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .5s}
.hs{font-size:14px;margin-top:8px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--blue));flex:none}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;align-content:start;min-height:112px}
.mode b{font-size:17px;line-height:1.2}
.mode span{font-size:14px;color:var(--mut);line-height:1.35}
.mode.rec{border:2px solid var(--orange)}
.mode em{font-style:normal;font-size:12px;font-weight:800;color:var(--orange)}
.mode svg{width:30px;height:30px;margin-bottom:2px}
details.sci{margin-top:18px;background:var(--soft);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
details.sci summary{font-weight:800;cursor:pointer;min-height:28px}
details.sci li{margin:6px 0;font-size:15px}
.sbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:800;flex:none}
.grow{flex:1}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:inherit}
.kcard{border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px 34px;min-height:340px;box-shadow:0 3px 0 var(--line);background-color:var(--card);background-image:linear-gradient(90deg,transparent 20px,rgba(232,102,77,.5) 20px,rgba(232,102,77,.5) 22px,transparent 22px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px)}
.turn{animation:turn .38s ease}
@keyframes turn{50%{transform:scaleX(.02)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.turn,.pop,.shake{animation:none!important}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--mut)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lv{display:inline-flex;gap:3px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lv i.f{background:var(--orange)}
.q{font-size:clamp(22px,6vw,27px);font-weight:800;line-height:1.22;letter-spacing:-.01em;margin:12px 0 14px}
.ans{font-size:19px;font-weight:800;line-height:1.4;margin:8px 0}
.hints{margin:0 0 10px;padding-left:20px;color:var(--blue);font-weight:700}
textarea,input[type=date],select{width:100%;font:16px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:86px;margin-top:10px;resize:vertical}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three .btn{padding:8px 4px;font-size:15px}
.c0,.r0{background:var(--bad)}
.c1,.r1{background:var(--orange)}
.c2,.r2{background:var(--ok)}
.zbox{background:var(--soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:10px;font-size:15px;margin:10px 0}
.zbox.why{border-left-color:var(--orange)}
.zbox.mine{border-left-color:var(--mut)}
.gx{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.gx svg{width:100%;height:auto;display:block}
.gx text{font-family:Nunito,sans-serif;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{padding:6px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:14px}
.st.hl{background:var(--orange);color:#fff;border-color:transparent}
.ar{color:var(--mut);font-weight:800}
.tlr{display:grid;grid-template-columns:5.4em 12px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:15px}
.tlr .y{font-weight:800;white-space:nowrap;text-align:right}
.tlr .d{width:12px;height:12px;border-radius:50%;background:var(--line)}
.tlr.hl{color:var(--coral);font-weight:800}
.tlr.hl .d{background:var(--coral)}
.lst{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:15px}
.lst b{white-space:nowrap}
.lst .hl{color:var(--coral)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;min-height:52px;font-weight:700}
.opt.ok{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.opt.no{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--soft);border:1px solid var(--line)}
.fb b.g{color:var(--ok)}
.fb b.n{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:56px;font-weight:700;font-size:15px;text-align:left}
.mi.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.mi.done{opacity:.5;border-color:var(--ok);text-decoration:line-through}
.shake{animation:shake .3s}
.ck{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;min-height:48px;font-size:15px}
.ck .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.ck.on{border-color:var(--ok)}
.ck.on .b{background:var(--ok);border-color:var(--ok)}
.big{text-align:center;padding:22px 10px}
.big .e{font-size:76px;line-height:1;animation:pop .45s ease}
.big .n{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:13px;color:var(--mut)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 3.4em;gap:4px 10px;align-items:center;margin:10px 0}
.mrow .lbl{grid-column:1/-1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.mrow .pc{text-align:right;font-weight:800;white-space:nowrap}
.ul{padding-left:18px;margin:6px 0}
.ul li{margin:4px 0;font-size:15px}
.tros{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tro{text-align:center;padding:12px 8px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.tro .e{font-size:42px;line-height:1.1}
.tro b{display:block;font-size:15px;margin-top:4px}
.tro span{font-size:12.5px;color:var(--mut);display:block;line-height:1.3}
.tro.lock .e{filter:grayscale(1);opacity:.3}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:800;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(16,20,43,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal>div{background:var(--card);color:var(--ink);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center}
.modal .e{font-size:96px;line-height:1;animation:pop .5s ease}
</style>
</head>
<body>

  <header>
    <div class="brand">Lern<b>kiste</b></div>

<script>
{
/* ===================== STAPEL (aus den Mitschriften vom 21. und 23.11.2026) =====================
   Felder: id, t (Thema), q (Frage), a (Antwort laut Mitschrift), x (Erklärung), z (Zusatzwissen, nicht in der Mitschrift),
   w (Denk-weiter-Frage), h (Hinweise), mc {q?, o:[richtig, falsch, falsch, falsch]}, g (Grafik), hl (hervorgehobenes Element) */
const DECK0 = {
  id: "gesch-9-2026-11", title: "Geschichte – Klassenarbeit", examDate: "2026-11-24",
  topics: [
    {id:"imp", n:"Imperialismus", c:"#f2911b"},
    {id:"kar", n:"Karikatur", c:"#2f4fd1"},
    {id:"glo", n:"Glossar", c:"#e8664d"},
    {id:"kla", n:"Klassengesellschaft", c:"#8b5cf6"},
    {id:"rev", n:"Wiener Kongress & 1848", c:"#0e9aa7"}
  ],
  graphics: {
    motive: {k:"wheel", c:"Imperialismus", items:["wirtschaftlich","gesellschaftlich","politisch","kulturell","religiös","nationalistisch"]},
    maechte: {k:"list", items:[["Großbritannien","große Gebiete in Afrika"],["Frankreich","großes Kolonialreich in Afrika"],["Deutschland","beteiligte sich am Erwerb von Kolonien"],["Belgien","Kongo"],["Portugal & Spanien","besaßen schon länger Kolonien"],["Italien","versuchte auch, Kolonien zu erwerben"]]},
    karikatur: {k:"steps", items:["1 Formale Aspekte","2 Beschreiben","3 Analysieren"]},
    klassen: {k:"pyramid", items:["Adel","Bürgertum","Kleinbürgertum","Arbeiter & Bauern"]},
    zeit: {k:"timeline", items:[["1814/15","Wiener Kongress"],["1832","Hambacher Fest"],["März 1848","Revolution, Straßenkämpfe"],["1848","Nationalversammlung Frankfurt"],["1849","Revolution scheitert"]]},
    glossar: {k:"list", items:[["Arbeiterbewegung","Kampf für bessere Arbeitsbedingungen"],["Kommunismus","Gesellschaft ohne Klassen"],["Sozialdemokratie","ohne Gewalt für die Arbeiter"]]}
  },
  cards: [
    {id:"i1",t:"imp",q:"Was versteht man unter Imperialismus?",a:"Die Ausweitung von Macht und Einfluss: andere Länder erobern oder beherrschen – mit dem Ziel, ein Imperium (Weltreich) zu werden.",z:"Die Hochphase heißt „Hochimperialismus“, etwa 1880 bis 1914.",w:"Warum reichte vielen Staaten ihr eigenes Land nicht mehr?",h:["Denk an das Wort „Imperium“.","Es geht um Macht und Einfluss – auch weit weg vom eigenen Land."],mc:{o:["Ausweitung von Macht und Einfluss durch Erobern oder Beherrschen anderer Länder","Freiwilliger Zusammenschluss gleichberechtigter Staaten zum Handel","Kampf der Arbeiter für bessere Arbeitsbedingungen","Rückkehr der Fürsten an die Macht nach 1815"]},g:"motive"},
    {id:"i2",t:"imp",q:"Nenne die sechs Betrachtungsebenen (Motive) des Imperialismus.",a:"wirtschaftlich, gesellschaftlich, politisch, kulturell, religiös, nationalistisch",x:"Eselsbrücke W-G-P-K-R-N: „Wir Gehen Pizza Kaufen, Rate Nochmal!“",h:["Eine Ebene hat mit Geld zu tun, eine mit Glauben.","W – G – P – K – R – N"],mc:{q:"Welche Ebene steht NICHT in deiner Tabelle der Motive?",o:["ökologisch","religiös","kulturell","nationalistisch"]},g:"motive"},
    {id:"i3",t:"imp",q:"Welche wirtschaftlichen Ziele verfolgten die Kolonialmächte?",a:"Mehr Land und Fläche; durch Rohstoffe mehr Geld; neue Waren; mehr Steuereinnahmen; mehr günstige Arbeiter.",z:"Kolonien waren außerdem Absatzmärkte für Waren aus der eigenen Industrie.",w:"Warum brauchten gerade Industrieländer so viele Rohstoffe?",h:["Was brauchen Fabriken?","Rohstoffe, Geld, Arbeiter …"],mc:{q:"Welches Motiv ist wirtschaftlich?",o:["Rohstoffe gewinnen und mehr Steuern einnehmen","Andersgläubige missionieren","Die eigene Sprache verbreiten","Stützpunkte gewinnen"]},g:"motive",hl:0},
    {id:"i4",t:"imp",q:"Welches gesellschaftliche Ziel hatte der Imperialismus?",a:"Das Volk zu Hause einen und gesellschaftliche Probleme zu Hause lösen → soziale Frage.",x:"Die soziale Frage meint die Not der Arbeiter in der Industrialisierung.",z:"Kolonien sollten Arbeit und Wohlstand versprechen und von den Problemen zu Hause ablenken.",w:"Wie hängt die Not der Fabrikarbeiter mit Kolonien in Afrika zusammen?",h:["Es geht um Probleme zu Hause.","Stichwort: soziale …"],mc:{q:"Welches Stichwort gehört zum gesellschaftlichen Motiv?",o:["soziale Frage","Kräftemessen der Mächte","Mission","Steuereinnahmen"]},g:"motive",hl:1},
    {id:"i5",t:"imp",q:"Welche politischen Ziele verfolgten die Kolonialmächte?",a:"Außenpolitischen Einfluss auf der Welt gewinnen, Stützpunkte und Macht erlangen, Kräftemessen zwischen den europäischen Mächten.",w:"Warum wollte keine Großmacht hinter den anderen zurückbleiben?",h:["Es geht um Macht zwischen den Staaten.","Stützpunkte, Einfluss, Kräftemessen"],mc:{q:"„Stützpunkte gewinnen und Kräftemessen der Großmächte“ – welche Ebene?",o:["politisch","kulturell","wirtschaftlich","religiös"]},g:"motive",hl:2},
    {id:"i6",t:"imp",q:"Was war das kulturelle Motiv?",a:"Die eigene Kultur verbreiten, z. B. Sprache, Kleidung, Gerichte, Werte & Normen, Bildung.",w:"Was sagt es über die Europäer aus, dass sie ihre Kultur für „besser“ hielten?",h:["Sprache, Essen, Werte …"],mc:{q:"„Sprache, Werte und Bildung verbreiten“ – welche Ebene?",o:["kulturell","politisch","nationalistisch","wirtschaftlich"]},g:"motive",hl:3},
    {id:"i7",t:"imp",q:"Was war das religiöse Motiv?",a:"Die eigene Religion verbreiten und Andersgläubige missionieren – und dadurch Macht ausüben.",h:["Glaube …","missionieren"],mc:{q:"„Andersgläubige missionieren“ – welche Ebene?",o:["religiös","kulturell","gesellschaftlich","politisch"]},g:"motive",hl:4},
    {id:"i8",t:"imp",q:"Was war das nationalistische Motiv?",a:"Die eigene Nation vergrößern und ihr mehr Einfluss verschaffen – mit der Überzeugung: „Die eigene Nation ist die beste.“",h:["Nation …","„Wir sind die Besten“"],mc:{q:"„Die eigene Nation ist die beste“ – welche Ebene?",o:["nationalistisch","politisch","religiös","kulturell"]},g:"motive",hl:5},
    {id:"i9",t:"imp",q:"Welche Rolle spielte Rassismus im Imperialismus?",a:"Der Imperialismus war von Rassismus angetrieben. Rassismus findet sich in allen Formen des Imperialismus: „Kein Imperialismus ohne Rassismus.“",z:"Die Europäer hielten sich für überlegen (oft mit dem „Sozialdarwinismus“ begründet) und rechtfertigten so Eroberung und Ausbeutung.",w:"Warum brauchten die Kolonialmächte eine Rechtfertigung für ihre Herrschaft?",h:["Ein Satz aus deiner Mitschrift beginnt mit „Kein …“"],mc:{q:"Welcher Satz steht so in deiner Mitschrift?",o:["Kein Imperialismus ohne Rassismus.","Imperialismus war frei von Rassismus.","Rassismus gab es nur beim religiösen Motiv.","Rassismus entstand erst nach 1914."]}},

/* ===================== Speicher ===================== */
const KEY="lernkiste-v1", DKEY="lernkiste-decks";
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({points:0,days:[],tro:{},p:{},set:{tts:true,rate:1},deck:DECK0.id,filter:[],stats:{ok:0,calib:0}},store.get(KEY)||{});
S.stats=Object.assign({ok:0,calib:0},S.stats); S.set=Object.assign({tts:true,rate:1},S.set);
let decks=store.get(DKEY)||[];
const allDecks=()=>[DECK0,...decks.filter(d=>d.id!==DECK0.id)];
let D=allDecks().find(d=>d.id===S.deck)||DECK0;
const save=()=>store.set(KEY,S);
const P=()=>S.p[D.id]||(S.p[D.id]={c:{},tests:[],exam:null});
const ck=id=>P().c[id]||{lv:0,n:0,due:0,ok:0,bad:0,over:0};
const cs=id=>P().c[id]||(P().c[id]={lv:0,n:0,due:0,ok:0,bad:0,over:0});

/* ===================== Helfer ===================== */
const $=s=>document.querySelector(s), V=$("#view");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");
const dayStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dayStr(new Date());
const topic=id=>D.topics.find(t=>t.id===id)||{id,n:id,c:"#2f4fd1"};
const byId=id=>D.cards.find(c=>c.id===id);
function roundRobin(list){const g={},order=[];list.forEach(c=>{if(!g[c.t]){g[c.t]=[];order.push(c.t)}g[c.t].push(c)});const out=[];let more=true;while(more){more=false;order.forEach(t=>{if(g[t].length){out.push(g[t].shift());more=true}})}return out}
function activeFilter(){return (S.filter||[]).filter(id=>D.topics.some(t=>t.id===id))}
function filtered(){const f=activeFilter();return f.length?D.cards.filter(c=>f.includes(c.t)):D.cards}
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);save()}}
function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(dayStr(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dayStr(d))){n++;d.setDate(d.getDate()-1)}return n}
function examDate(){return P().exam||D.examDate||""}
function examTime(){const e=examDate();return e?new Date(e+"T08:00").getTime():0}
function examInfo(){const e=examDate();if(!e)return"";const a=new Date(e+"T00:00"),b=new Date(today()+"T00:00");const d=Math.round((a-b)/864e5);if(d<0)return"";return d===0?"Arbeit heute":d===1?"Arbeit morgen":"Arbeit in "+d+" Tagen"}
function ivl(lv){const m=[1,5,30,240,1440,4320,10080][Math.min(lv,6)];const ex=examTime(),now=Date.now();if(ex>now){return Math.min(m,Math.max(5,(ex-now)/120000))}return m}
function stats(cards){const n=cards.length,now=Date.now();let sum=0,mast=0,due=0;cards.forEach(c=>{const k=ck(c.id);sum+=Math.min(k.lv,4)/4;if(k.lv>=3)mast++;if(k.n>0&&k.due<=now)due++});return{n,mast,due,pct:n?Math.round(sum/n*100):0,mastPct:n?Math.round(mast/n*100):0}}
function mascot(p){return p<25?"🐣":p<50?"🐥":p<75?"🦊":p<100?"🦉":"🦄"}
let tT=null;
function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.style.display="block";clearTimeout(tT);tT=setTimeout(()=>{el.style.display="none"},2600)}
function speak(t){try{const ss=window.speechSynthesis;if(!ss){toast("Vorlesen geht auf diesem Gerät nicht");return}ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";const vs=ss.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("de"));const pv=vs.find(v=>/Anna|Helena|Petra|Marlene|Google/i.test(v.name))||vs[0];if(pv)u.voice=pv;u.rate=S.set.rate||1;ss.speak(u)}catch(e){toast("Vorlesen geht hier gerade nicht")}}
function hush(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}

function gfx(c){
  const g=c.g&&D.graphics&&D.graphics[c.g];if(!g)return"";const hl=c.hl;
  if(g.k==="wheel"){
    const n=g.items.length,cx=170,cy=118,rx=112,ry=86;
    const pts=g.items.map((t,i)=>{const a=(-90+i*360/n)*Math.PI/180;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a),t,i]});
    const lines=pts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width="2"/>`).join("");
    const boxes=pts.map(p=>{const on=p[3]===hl;return`<rect x="${(p[0]-54).toFixed(1)}" y="${(p[1]-15).toFixed(1)}" width="108" height="30" rx="15" fill="${on?"var(--orange)":"var(--soft)"}" stroke="${on?"var(--orange)":"var(--line)"}"/><text x="${p[0].toFixed(1)}" y="${(p[1]+4.5).toFixed(1)}" text-anchor="middle" font-size="12.5" fill="${on?"#fff":"var(--ink)"}">${esc(p[2])}</text>`}).join("");
    return`<div class="gx"><svg viewBox="0 0 340 236" role="img" aria-label="${esc(g.c)}: ${esc(g.items.join(", "))}">${lines}<circle cx="${cx}" cy="${cy}" r="50" fill="var(--coral)"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12.5" fill="#fff">${esc(g.c)}</text>${boxes}</svg></div>`;
  }
  if(g.k==="pyramid"){
    const n=g.items.length,top=8,H=210,bh=(H-top-8)/n,gap=4,w=y=>56+(y-top)/(H-top)*270;
    const bands=g.items.map((t,i)=>{const y0=top+i*bh,y1=y0+bh-gap,a=w(y0),b=w(y1),on=hl===i||hl==null;const f=hl==null?["var(--coral)","#f2911b","#8b5cf6","var(--blue)"][i%4]:(on?"var(--orange)":"var(--soft)");
      return`<polygon points="${170-a/2},${y0} ${170+a/2},${y0} ${170+b/2},${y1} ${170-b/2},${y1}" fill="${f}" stroke="var(--line)"/><text x="170" y="${(y0+y1)/2+4.5}" text-anchor="middle" font-size="13" fill="${hl==null||on?"#fff":"var(--ink)"}">${esc(t)}</text>`}).join("");
    return`<div class="gx"><svg viewBox="0 0 340 ${H}" role="img" aria-label="Schichten: ${esc(g.items.join(", "))}">${bands}</svg></div>`;
  }
  if(g.k==="steps")return`<div class="gx steps">${g.items.map((t,i)=>`${i?'<span class="ar">→</span>':""}<span class="st${i===hl?" hl":""}">${esc(t)}</span>`).join("")}</div>`;
  if(g.k==="timeline")return`<div class="gx">${g.items.map((r,i)=>`<div class="tlr${i===hl?" hl":""}"><span class="y">${esc(r[0])}</span><span class="d"></span><span>${esc(r[1])}</span></div>`).join("")}</div>`;
  if(g.k==="list")return`<div class="gx lst">${g.items.map((r,i)=>`<b class="${i===hl?"hl":""}">${esc(r[0])}</b><span class="${i===hl?"hl":""}">${esc(r[1])}</span>`).join("")}</div>`;
  return"";
}

function buildQueue(){
  const now=Date.now(),cards=filtered();
  const due=cards.filter(c=>ck(c.id).n>0&&ck(c.id).due<=now).sort((a,b)=>ck(a.id).due-ck(b.id).due);
  const neu=roundRobin(cards.filter(c=>!ck(c.id).n));
  let q=due.concat(neu);
  if(q.length<12)q=q.concat(cards.filter(c=>!q.includes(c)).sort((a,b)=>ck(a.id).lv-ck(b.id).lv||ck(a.id).due-ck(b.id).due));
  return roundRobin(q.slice(0,12)).map(c=>c.id);
}

function rateCard(v){
  const c=byId(L.q[L.i]),k=cs(c.id),now=Date.now();k.n++;
  let pts=v===2?10:v===1?5:2;pts=Math.max(1,pts-2*L.hints);
  if(v===2){k.lv=Math.min(k.lv+1,6);k.ok++;S.stats.ok++;L.ok++;k.over=0}
  else if(v===1){k.lv=Math.max(1,k.lv)}
  else{k.lv=0;k.bad++;if(L.conf===2)k.over=1}
  if((L.conf===2&&v===2)||(L.conf===0&&v===0))S.stats.calib++;
  k.due=now+(v===0?1:ivl(v===1?Math.max(1,k.lv-1):k.lv))*60000;
  S.points+=pts;L.pts+=pts;L.n++;
  if(v<2&&(L.rq[c.id]||0)<2){L.rq[c.id]=(L.rq[c.id]||0)+1;L.q.splice(Math.min(L.i+1+(v===0?3:5),L.q.length),0,c.id)}
  L.i++;L.flip=false;L.conf=null;L.hints=0;L.typed="";L.showType=false;hush();save();render();checkTro();
}

  <span class="chip" style="--c:${esc(tp.c)}"><i></i>${esc(tp.n)}</span><h2 class="q">${esc(it.q)}</h2>
  <textarea id="etxt" placeholder="Schreib deine Antwort wie in der Arbeit – Stichpunkte sind okay.">${esc(E.txt)}</textarea>
  ${E.show?`<p class="sub mt"><b>Erwartungshorizont</b> – hake ab, was in deiner Antwort vorkommt:</p>${it.p.map((p,i)=>`<button class="ck${E.ticks.includes(i)?" on":""}" data-act="tick" data-v="${i}"><span class="b">${E.ticks.includes(i)?"✓":""}</span><span>${esc(p)}</span></button>`).join("")}<button class="btn mt" data-act="enext" style="width:100%">Weiter (${E.ticks.length}/${it.p.length})</button>`:`<button class="btn mt" data-act="eshow" style="width:100%">Erwartungshorizont zeigen</button>`}`;
}

function prog(){
  const st=stats(D.cards),now=Date.now();
  const over=D.cards.filter(c=>ck(c.id).over),weak=D.cards.filter(c=>{const k=ck(c.id);return k.n>0&&k.lv<2}),tests=P().tests.slice(-6).reverse();
  report=[`Lernstand ${D.title} – ${new Date().toLocaleDateString("de-DE")}`,`Gelernt: ${st.pct} % · sicher: ${st.mast}/${st.n} Karten`,`Lerntage in Folge: ${streak()} · Punkte: ${S.points}`,...D.topics.map(t=>`- ${t.n}: ${stats(D.cards.filter(c=>c.t===t.id)).pct} %`),weak.length?`Noch unsicher: ${weak.map(c=>c.q).join(" | ")}`:"Keine unsicheren Karten",tests.length?`Letzter Test: ${tests[0].s}/${tests[0].n}`:"Noch kein Lernstand-Test"].join("\n");
  V.innerHTML=`<h2 class="h">Dein Fortschritt</h2>
  <div class="kpis"><div class="kpi"><b>${st.pct} %</b><span>gelernt</span></div><div class="kpi"><b>${streak()}</b><span>Lerntage in Folge</span></div><div class="kpi"><b>${S.points}</b><span>Punkte</span></div></div>
  <div class="card2"><b>Nach Themen</b>${D.topics.map(t=>{const s=stats(D.cards.filter(c=>c.t===t.id));return`<div class="mrow"><div class="lbl"><span class="chip" style="--c:${esc(t.c)}"><i></i></span>${esc(t.n)}</div><div class="meter"><i style="width:${s.pct}%;background:${esc(t.c)}"></i></div><span class="pc">${s.pct} %</span></div>`}).join("")}</div>
  <div class="card2"><b>Überschätzt</b> <span class="sub">– „sicher“ gesagt, aber nicht gewusst</span>${over.length?`<ul class="ul">${over.map(c=>`<li>${esc(c.q)}</li>`).join("")}</ul>`:`<p class="sub">Keine – deine Selbsteinschätzung passt.</p>`}</div>
  <div class="card2"><b>Noch unsicher</b>${weak.length?`<ul class="ul">${weak.map(c=>`<li>${esc(c.q)}</li>`).join("")}</ul>`:`<p class="sub">Keine. Stark!</p>`}</div>
  <div class="card2"><b>Lernstand-Tests</b>${tests.length?tests.map(t=>`<div class="mrow"><div class="lbl">${new Date(t.d).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="meter"><i style="width:${t.s/t.n*100}%;background:var(--blue)"></i></div><span class="pc">${t.s}/${t.n}</span></div>`).join(""):`<p class="sub">Noch keiner gemacht.</p>`}<button class="btn ghost sm mt" data-act="test">Test starten</button></div>
  <button class="btn" data-act="copy" style="width:100%">Lernstand kopieren und teilen</button>
  <div id="rep"></div>`;
}
function tro(){
  const n=TRO.filter(t=>S.tro[t.id]).length;
  V.innerHTML=`<h2 class="h">Trophäen</h2><p class="sub">${n} von ${TRO.length} Maskottchen gesammelt</p>
  <div class="tros mt">${TRO.map(t=>{const d=S.tro[t.id];return`<div class="tro${d?"":" lock"}"><div class="e">${t.e}</div><b>${d?esc(t.n):"???"}</b><span>${esc(t.d)}</span></div>`}).join("")}</div>`;
}
function more(){
  V.innerHTML=`<h2 class="h">Einstellungen</h2>
  <div class="card2"><label for="exdate"><b>Datum der Arbeit</b></label><p class="sub">Bis dahin werden die Wiederholungen dichter geplant.</p><input type="date" id="exdate" value="${esc(examDate())}"></div>
  <div class="card2"><b>Vorlesen</b><p class="sub">Die Lösung wird beim Umdrehen vorgelesen.</p>
    <div class="row"><button class="btn ${S.set.tts?"":"ghost"} sm" data-act="tts">${S.set.tts?"An":"Aus"}</button>${[[.85,"Langsam"],[1,"Normal"],[1.15,"Schnell"]].map(r=>`<button class="btn sm ${S.set.rate===r[0]?"":"ghost"}" data-act="rate2" data-v="${r[0]}">${r[1]}</button>`).join("")}<button class="btn ghost sm" data-act="saytest">Test</button></div></div>
  <div class="card2"><b>Lernstapel</b><p class="sub">Neue Stapel bekommst du als .json-Datei (z. B. per AirDrop oder WhatsApp in „Dateien“ sichern).</p>
    ${allDecks().map(d=>`<button class="opt${d.id===D.id?" ok":""}" data-act="deck" data-v="${esc(d.id)}">${esc(d.title)} <span class="sub">· ${d.cards.length} Karten</span></button>`).join("")}
    <label class="btn ghost sm mt" style="display:inline-flex;align-items:center" for="deckfile">Stapel laden …</label><input type="file" id="deckfile" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px"></div>
  <div class="card2"><b>Fortschritt zurücksetzen</b><p class="sub">Löscht Lernstand und Tests für diesen Stapel. Punkte und Trophäen bleiben.</p><button class="btn ghost sm" data-act="reset">${S._rs?"Wirklich löschen? Nochmal tippen":"Zurücksetzen"}</button></div>
  <p class="sub">Alles bleibt nur auf diesem Gerät gespeichert. Inhalte: Mitschriften vom 21. und 23.11.2026; Zusatzwissen ist auf den Karten gekennzeichnet.</p>`;
}

function render(){
  pills();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===cur||(b.dataset.v==="home"&&["learn","quiz","match","exam"].includes(cur))));
  ({home,learn,quiz,match,exam,prog,tro,more})[cur]();
}
function go(v){cur=v;hush();render();V.scrollTop=0}

/* ===================== Ereignisse ===================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case"nav":S._rs=false;go(v);break;
    case"home":go("home");break;
    case"closemodal":{const m=$(".modal");if(m)m.remove();showTro();break}
    case"tag":{if(!v)S.filter=[];else{const f=activeFilter();S.filter=f.includes(v)?f.filter(x=>x!==v):f.concat(v)}save();render();break}
    case"learn":startLearn();break;
    case"quiz":startQuiz(false);break;
    case"test":startQuiz(true);break;
    case"match":startMatch(0);break;
    case"mset":startMatch(+v);break;
    case"exam":startExam();break;
    case"hint":L.hints++;render();break;
    case"type":L.showType=!L.showType;render();if(L.showType){const t=$("#typed");if(t)t.focus()}break;
    case"flip":{L.conf=+v;L.flip=true;L.anim=true;render();if(S.set.tts)speak(sayText(byId(L.q[L.i])));break}
    case"rate":rateCard(+v);break;
    case"say":{const id=cur==="learn"?L.q[L.i]:Q.items[Q.i].id;speak(sayText(byId(id)));break}
    case"pick":{if(Q.ans!=null)break;const it=Q.items[Q.i],c=byId(it.id),ok=it.opts[+v].ok,k=cs(c.id);Q.ans=+v;const r=Q.by[c.t]||(Q.by[c.t]=[0,0]);r[1]++;
      if(ok){Q.score++;r[0]++;S.points+=10;k.lv=Math.max(k.lv,1);if(!k.n)k.due=Date.now()+ivl(1)*60000}else{k.lv=0;k.due=Date.now()}
      k.n++;save();render();break}
    case"qnext":Q.i++;Q.ans=null;hush();render();break;
    case"ml":M.sel=+v;render();break;
    case"mr":{if(M.sel==null){toast("Tippe zuerst links einen Begriff");break}if(+v===M.sel){M.done.push(+v)}else{M.err++;M.bad=+v}M.sel=null;render();break}
    case"eshow":E.show=true;render();break;
    case"tick":{const i=+v;E.ticks=E.ticks.includes(i)?E.ticks.filter(x=>x!==i):E.ticks.concat(i);render();break}
    case"enext":{const it=D.exam[E.i];E.got+=E.ticks.length;E.max+=it.p.length;S.points+=E.ticks.length*5;E.i++;E.show=false;E.ticks=[];E.txt="";if(E.i>=D.exam.length)S.stats.ex=1;save();render();V.scrollTop=0;checkTro();break}
    case"copy":{const done=()=>toast("Kopiert – jetzt z. B. in WhatsApp einfügen");const fall=()=>{$("#rep").innerHTML=`<textarea readonly style="min-height:160px">${esc(report)}</textarea><p class="sub">Text markieren und kopieren.</p>`};try{navigator.clipboard.writeText(report).then(done,fall)}catch(err){fall()}break}
    case"tts":S.set.tts=!S.set.tts;save();render();break;
    case"rate2":S.set.rate=+v;save();render();break;
    case"saytest":speak("Hallo! So klingt die Vorlesestimme.");break;
    case"deck":{const d=allDecks().find(x=>x.id===v);if(d){D=d;S.deck=d.id;save();toast("Stapel gewechselt");render()}break}
    case"reset":if(!S._rs){S._rs=true;render()}else{S._rs=false;delete S.p[D.id];save();toast("Fortschritt zurückgesetzt");render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="typed"&&L)L.typed=e.target.value;if(e.target.id==="etxt"&&E)E.txt=e.target.value});
document.addEventListener("change",e=>{
  if(e.target.id==="exdate"){P().exam=e.target.value||null;save();toast("Datum gespeichert")}
  if(e.target.id==="deckfile"&&e.target.files&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.cards)||!o.cards.length)throw new Error("leer");
      o.id=String(o.id||("deck-"+Date.now()));o.title=String(o.title||"Neuer Stapel");
      if(!Array.isArray(o.topics)||!o.topics.length)o.topics=[{id:"all",n:"Alle",c:"#2f4fd1"}];
      o.cards=o.cards.filter(c=>c&&c.q&&c.a).map((c,i)=>Object.assign({},c,{id:String(c.id||("c"+i)),t:c.t||o.topics[0].id}));
      o.graphics=o.graphics||{};o.match=o.match||[];o.exam=o.exam||[];
      decks=decks.filter(d=>d.id!==o.id).concat(o);store.set(DKEY,decks);D=o;S.deck=o.id;save();toast("Stapel geladen: "+o.title);render()
    }catch(err){toast("Die Datei passt nicht – bitte eine Lernkiste-.json wählen")}};
    r.readAsText(e.target.files[0]);
  }
});
try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
render();checkTro();
}
</script>
</body>
</html>
