<style>
/* VOICE everyday learning for a 14-year-old: friendly, focused, playful rewards
   IDEA a Karteikasten made from her own Geschichte notebook: ruled index cards with a red margin
   PICTURE the index card itself, large; its back carries a diagram with the answer highlighted
   COLOUR white paper, blue ink #1d2754, coral headline #e8664d, orange marker #f2911b; night = deep ink blue
   TYPE Nunito 800 + Nunito
   LAYOUT one phone column (max 560px): header pills, scrolling view, bottom tab bar; same column centred on a laptop */
:root{--bg:#fff;--ink:#1d2754;--mut:#5b6385;--line:#e1e6f6;--card:#fff;--rule:#dde5fa;--soft:#f3f5fd;--coral:#e8664d;--orange:#f2911b;--blue:#2f4fd1;--ok:#178a57;--bad:#cf3b31;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10142b;--ink:#e9ecff;--mut:#a7aed3;--line:#2b3262;--card:#181d3d;--rule:#232a55;--soft:#161b38;--blue:#8aa0ff;--ok:#3fc98a;--bad:#ff7a6e;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b{color:var(--coral)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.pill svg{width:15px;height:15px}
main{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}

nav button svg{width:22px;height:22px}
nav button.on{color:var(--coral)}
button{font:inherit;cursor:pointer}
.btn{min-height:46px;border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--blue);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.h{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:20px 0 8px;line-height:1.15}
.sub{color:var(--mut);font-size:14px}
.mt{margin-top:14px}
.nowrap{white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero{background:var(--coral);color:#fff;border-radius:22px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:6px}
.mascot{font-size:54px;width:86px;height:86px;display:grid;place-items:center;background:rgba(255,255,255,.22);border-radius:50%;line-height:1}
.hk{font-size:14px;font-weight:700;opacity:.92}
.hb{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:2px 0 8px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .5s}
.hs{font-size:14px;margin-top:8px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--blue));flex:none}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;align-content:start;min-height:112px}
.mode b{font-size:17px;line-height:1.2}
.mode span{font-size:14px;color:var(--mut);line-height:1.35}
.mode.rec{border:2px solid var(--orange)}
.mode em{font-style:normal;font-size:12px;font-weight:800;color:var(--orange)}
.mode svg{width:30px;height:30px;margin-bottom:2px}
details.sci{margin-top:18px;background:var(--soft);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
details.sci summary{font-weight:800;cursor:pointer;min-height:28px}
details.sci li{margin:6px 0;font-size:15px}
.sbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:800;flex:none}
.grow{flex:1}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:inherit}
.kcard{border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px 34px;min-height:340px;box-shadow:0 3px 0 var(--line);background-color:var(--card);background-image:linear-gradient(90deg,transparent 20px,rgba(232,102,77,.5) 20px,rgba(232,102,77,.5) 22px,transparent 22px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px)}
.turn{animation:turn .38s ease}
@keyframes turn{50%{transform:scaleX(.02)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.turn,.pop,.shake{animation:none!important}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--mut)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lv{display:inline-flex;gap:3px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lv i.f{background:var(--orange)}
.q{font-size:clamp(22px,6vw,27px);font-weight:800;line-height:1.22;letter-spacing:-.01em;margin:12px 0 14px}
.ans{font-size:19px;font-weight:800;line-height:1.4;margin:8px 0}
.numin{margin:6px 0 10px}
.numin input{flex:1;font:700 18px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);min-height:48px}
.unit{font-weight:800;white-space:nowrap}
.sol{margin:6px 0 0;padding-left:20px}
.sol li{margin:3px 0}
.okb{border-left-color:var(--ok)}
.nob{border-left-color:var(--bad)}
.decks{margin:6px 0 4px}
.hints{margin:0 0 10px;padding-left:20px;color:var(--blue);font-weight:700}
textarea,input[type=date],select{width:100%;font:16px Nunito,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:86px;margin-top:10px;resize:vertical}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three .btn{padding:8px 4px;font-size:15px}
.c0,.r0{background:#c2362c}
.c1,.r1{background:#b45309}
.c2,.r2{background:#157a4d}
.daily{display:grid;gap:2px;width:100%;text-align:left;margin-top:12px;padding:14px 16px;border-radius:18px;border:2px solid var(--orange);background:var(--card);color:var(--ink)}
.daily .dt{font-size:19px;font-weight:800}
.daily .ds{font-size:14px;color:var(--mut)}
.badge{font-size:12px;font-weight:800;color:#fff;background:#b45309;border-radius:99px;padding:2px 9px}
.notice.news{border-left-color:var(--blue);align-items:flex-start}
.notice{margin:4px 16px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--bad);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.zbox{background:var(--soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:10px;font-size:15px;margin:10px 0}
.zbox.why{border-left-color:var(--orange)}
.zbox.mine{border-left-color:var(--mut)}
.gx{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.gx svg{width:100%;height:auto;display:block}
.gx text{font-family:Nunito,sans-serif;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{padding:6px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:14px}
.st.hl{background:var(--orange);color:#fff;border-color:transparent}
.ar{color:var(--mut);font-weight:800}
.tlr{display:grid;grid-template-columns:5.4em 12px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:15px}
.tlr .y{font-weight:800;white-space:nowrap;text-align:right}
.tlr .d{width:12px;height:12px;border-radius:50%;background:var(--line)}
.tlr.hl{color:var(--coral);font-weight:800}
.tlr.hl .d{background:var(--coral)}
.lst{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:15px}
.lst b{white-space:nowrap}
.lst .hl{color:var(--coral)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;min-height:52px;font-weight:700}
.opt.ok{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.opt.no{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--soft);border:1px solid var(--line)}
.fb b.g{color:var(--ok)}
.fb b.n{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:56px;font-weight:700;font-size:15px;text-align:left}
.mi.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.mi.done{opacity:.5;border-color:var(--ok);text-decoration:line-through}
.shake{animation:shake .3s}
.ck{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;min-height:48px;font-size:15px}
.ck .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.ck.on{border-color:var(--ok)}
.ck.on .b{background:var(--ok);border-color:var(--ok)}
.big{text-align:center;padding:22px 10px}
.big .e{font-size:76px;line-height:1;animation:pop .45s ease}
.big .n{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:13px;color:var(--mut)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 3.4em;gap:4px 10px;align-items:center;margin:10px 0}
.mrow .lbl{grid-column:1/-1;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.mrow .pc{text-align:right;font-weight:800;white-space:nowrap}
.ul{padding-left:18px;margin:6px 0}
.ul li{margin:4px 0;font-size:15px}
.tros{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tro{text-align:center;padding:12px 8px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.tro .e{font-size:42px;line-height:1.1}
.tro b{display:block;font-size:15px;margin-top:4px}
.tro span{font-size:12.5px;color:var(--mut);display:block;line-height:1.3}
.tro.lock .e{filter:grayscale(1);opacity:.3}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:800;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(16,20,43,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal>div{background:var(--card);color:var(--ink);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center}
.modal .e{font-size:96px;line-height:1;animation:pop .5s ease}
</style>
</head>

<script type="application/json" class="lk-deck" id="deck-gesch-9-2026-11">{"id": "gesch-9-2026-11", "subject": "Geschichte", "title": "Geschichte – Klassenarbeit", "examDate": "2026-11-24", "topics": [{"id": "imp", "n": "Imperialismus", "c": "#f2911b"}, {"id": "kar", "n": "Karikatur", "c": "#2f4fd1"}, {"id": "glo", "n": "Glossar", "c": "#e8664d"}, {"id": "kla", "n": "Klassengesellschaft", "c": "#8b5cf6"}, {"id": "rev", "n": "Wiener Kongress & 1848", "c": "#0e9aa7"}], "graphics": {"motive": {"k": "wheel", "c": "Imperialismus", "items": ["wirtschaftlich", "gesellschaftlich", "politisch", "kulturell", "religiös", "nationalistisch"]}, "maechte": {"k": "list", "items": [["Großbritannien", "große Gebiete in Afrika"], ["Frankreich", "großes Kolonialreich in Afrika"], ["Deutschland", "beteiligte sich am Erwerb von Kolonien"], ["Belgien", "Kongo"], ["Portugal & Spanien", "besaßen schon länger Kolonien"], ["Italien", "versuchte auch, Kolonien zu erwerben"]]}, "karikatur": {"k": "steps", "items": ["1 Formale Aspekte", "2 Beschreiben", "3 Analysieren"]}, "klassen": {"k": "pyramid", "items": ["Adel", "Bürgertum", "Kleinbürgertum", "Arbeiter & Bauern"]}, "zeit": {"k": "timeline", "items": [["1814/15", "Wiener Kongress"], ["1832", "Hambacher Fest"], ["März 1848", "Revolution, Straßenkämpfe"], ["1848", "Nationalversammlung Frankfurt"], ["1849", "Revolution scheitert"]]}, "glossar": {"k": "list", "items": [["Arbeiterbewegung", "Kampf für bessere Arbeitsbedingungen"], ["Kommunismus", "Gesellschaft ohne Klassen"], ["Sozialdemokratie", "ohne Gewalt für die Arbeiter"]]}}, "cards": [{"id": "i1", "t": "imp", "q": "Was versteht man unter Imperialismus?", "a": "Die Ausweitung von Macht und Einfluss: andere Länder erobern oder beherrschen – mit dem Ziel, ein Imperium (Weltreich) zu werden.", "z": "Die Hochphase heißt „Hochimperialismus“, etwa 1880 bis 1914.", "w": "Warum reichte vielen Staaten ihr eigenes Land nicht mehr?", "h": ["Denk an das Wort „Imperium“.", "Es geht um Macht und Einfluss – auch weit weg vom eigenen Land."], "mc": {"o": ["Ausweitung von Macht und Einfluss durch Erobern oder Beherrschen anderer Länder", "Freiwilliger Zusammenschluss gleichberechtigter Staaten zum Handel", "Kampf der Arbeiter für bessere Arbeitsbedingungen", "Rückkehr der Fürsten an die Macht nach 1815"]}, "g": "motive"}, {"id": "i2", "t": "imp", "q": "Nenne die sechs Betrachtungsebenen (Motive) des Imperialismus.", "a": "wirtschaftlich, gesellschaftlich, politisch, kulturell, religiös, nationalistisch", "x": "Eselsbrücke W-G-P-K-R-N: „Wir Gehen Pizza Kaufen, Rate Nochmal!“", "h": ["Eine Ebene hat mit Geld zu tun, eine mit Glauben.", "W – G – P – K – R – N"], "mc": {"q": "Welche Ebene steht NICHT in deiner Tabelle der Motive?", "o": ["ökologisch", "religiös", "kulturell", "nationalistisch"]}, "g": "motive"}, {"id": "i3", "t": "imp", "q": "Welche wirtschaftlichen Ziele verfolgten die Kolonialmächte?", "a": "Mehr Land und Fläche; durch Rohstoffe mehr Geld; neue Waren; mehr Steuereinnahmen; mehr günstige Arbeiter.", "z": "Kolonien waren außerdem Absatzmärkte für Waren aus der eigenen Industrie.", "w": "Warum brauchten gerade Industrieländer so viele Rohstoffe?", "h": ["Was brauchen Fabriken?", "Rohstoffe, Geld, Arbeiter …"], "mc": {"q": "Welches Motiv ist wirtschaftlich?", "o": ["Rohstoffe gewinnen und mehr Steuern einnehmen", "Andersgläubige missionieren", "Die eigene Sprache verbreiten", "Stützpunkte gewinnen"]}, "g": "motive", "hl": 0}, {"id": "i4", "t": "imp", "q": "Welches gesellschaftliche Ziel hatte der Imperialismus?", "a": "Das Volk zu Hause einen und gesellschaftliche Probleme zu Hause lösen → soziale Frage.", "x": "Die soziale Frage meint die Not der Arbeiter in der Industrialisierung.", "z": "Kolonien sollten Arbeit und Wohlstand versprechen und von den Problemen zu Hause ablenken.", "w": "Wie hängt die Not der Fabrikarbeiter mit Kolonien in Afrika zusammen?", "h": ["Es geht um Probleme zu Hause.", "Stichwort: soziale …"], "mc": {"q": "Welches Stichwort gehört zum gesellschaftlichen Motiv?", "o": ["soziale Frage", "Kräftemessen der Mächte", "Mission", "Steuereinnahmen"]}, "g": "motive", "hl": 1}, {"id": "i5", "t": "imp", "q": "Welche politischen Ziele verfolgten die Kolonialmächte?", "a": "Außenpolitischen Einfluss auf der Welt gewinnen, Stützpunkte und Macht erlangen, Kräftemessen zwischen den europäischen Mächten.", "w": "Warum wollte keine Großmacht hinter den anderen zurückbleiben?", "h": ["Es geht um Macht zwischen den Staaten.", "Stützpunkte, Einfluss, Kräftemessen"], "mc": {"q": "„Stützpunkte gewinnen und Kräftemessen der Großmächte“ – welche Ebene?", "o": ["politisch", "kulturell", "wirtschaftlich", "religiös"]}, "g": "motive", "hl": 2}, {"id": "i6", "t": "imp", "q": "Was war das kulturelle Motiv?", "a": "Die eigene Kultur verbreiten, z. B. Sprache, Kleidung, Gerichte, Werte & Normen, Bildung.", "w": "Was sagt es über die Europäer aus, dass sie ihre Kultur für „besser“ hielten?", "h": ["Sprache, Essen, Werte …"], "mc": {"q": "„Sprache, Werte und Bildung verbreiten“ – welche Ebene?", "o": ["kulturell", "politisch", "nationalistisch", "wirtschaftlich"]}, "g": "motive", "hl": 3}, {"id": "i7", "t": "imp", "q": "Was war das religiöse Motiv?", "a": "Die eigene Religion verbreiten und Andersgläubige missionieren – und dadurch Macht ausüben.", "h": ["Glaube …", "missionieren"], "mc": {"q": "„Andersgläubige missionieren“ – welche Ebene?", "o": ["religiös", "kulturell", "gesellschaftlich", "politisch"]}, "g": "motive", "hl": 4}, {"id": "i8", "t": "imp", "q": "Was war das nationalistische Motiv?", "a": "Die eigene Nation vergrößern und ihr mehr Einfluss verschaffen – mit der Überzeugung: „Die eigene Nation ist die beste.“", "h": ["Nation …", "„Wir sind die Besten“"], "mc": {"q": "„Die eigene Nation ist die beste“ – welche Ebene?", "o": ["nationalistisch", "politisch", "religiös", "kulturell"]}, "g": "motive", "hl": 5}, {"id": "i9", "t": "imp", "q": "Welche Rolle spielte Rassismus im Imperialismus?", "a": "Der Imperialismus war von Rassismus angetrieben. Rassismus findet sich in allen Formen des Imperialismus: „Kein Imperialismus ohne Rassismus.“", "z": "Die Europäer hielten sich für überlegen (oft mit dem „Sozialdarwinismus“ begründet) und rechtfertigten so Eroberung und Ausbeutung.", "w": "Warum brauchten die Kolonialmächte eine Rechtfertigung für ihre Herrschaft?", "h": ["Ein Satz aus deiner Mitschrift beginnt mit „Kein …“"], "mc": {"q": "Welcher Satz steht so in deiner Mitschrift?", "o": ["Kein Imperialismus ohne Rassismus.", "Imperialismus war frei von Rassismus.", "Rassismus gab es nur beim religiösen Motiv.", "Rassismus entstand erst nach 1914."]}}, {"id": "i10", "t": "imp", "q": "Welche europäischen Mächte betrieben vor allem Imperialismus? Nenne mindestens fünf.", "a": "Großbritannien, Frankreich, Deutschland, Belgien, Portugal & Spanien, Italien.", "h": ["Zwei große Mächte mit viel Afrika …", "… plus ein kleines Land mit dem Kongo."], "g": "maechte"}, {"id": "i11", "t": "imp", "q": "Großbritannien – was weißt du über seine Kolonien?", "a": "Großbritannien hatte große Gebiete in Afrika.", "z": "Es hatte das größte Kolonialreich der Welt, z. B. auch Indien.", "mc": {"q": "Welches Land hatte das größte Kolonialreich der Welt?", "o": ["Großbritannien", "Italien", "Belgien", "Deutschland"]}, "g": "maechte", "hl": 0}, {"id": "i12", "t": "imp", "q": "Frankreich – was weißt du über seine Kolonien?", "a": "Frankreich hatte ein großes Kolonialreich in Afrika.", "g": "maechte", "hl": 1}, {"id": "i13", "t": "imp", "q": "Welche Rolle spielte Deutschland im Imperialismus?", "a": "Deutschland beteiligte sich am Erwerb von Kolonien.", "z": "Deutschland kam spät dazu (ab 1884). Beispiele: Deutsch-Südwestafrika (heute Namibia), Deutsch-Ostafrika, Kamerun, Togo.", "mc": {"q": "Welches Gebiet war eine deutsche Kolonie?", "o": ["Deutsch-Südwestafrika (heute Namibia)", "Kongo", "Indien", "Brasilien"]}, "g": "maechte", "hl": 2}, {"id": "i14", "t": "imp", "q": "Welches Gebiet beherrschte Belgien?", "a": "Den Kongo.", "z": "Der Kongo war zuerst sogar Privatbesitz von König Leopold II.", "mc": {"q": "Welches Land beherrschte den Kongo?", "o": ["Belgien", "Frankreich", "Italien", "Portugal"]}, "g": "maechte", "hl": 3}, {"id": "i15", "t": "imp", "q": "Was unterschied Portugal & Spanien von den anderen Mächten?", "a": "Sie besaßen schon länger Kolonien.", "z": "Schon seit dem Zeitalter der Entdeckungen (ab etwa 1500).", "mc": {"q": "Welche Länder besaßen schon länger Kolonien?", "o": ["Portugal & Spanien", "Deutschland & Italien", "Belgien & Deutschland", "Italien & Frankreich"]}, "g": "maechte", "hl": 4}, {"id": "i16", "t": "imp", "q": "Was weißt du über Italien im Imperialismus?", "a": "Italien versuchte auch, Kolonien zu erwerben.", "g": "maechte", "hl": 5}, {"id": "k1", "t": "kar", "q": "In welchen drei Schritten analysierst du eine Karikatur?", "a": "1. Formale Aspekte  2. Beschreiben  3. Analysieren", "z": "Oft gehört als 4. Schritt „Beurteilen“ dazu. Frag nach, ob eure Lehrkraft das erwartet.", "h": ["Erst die Fakten zur Quelle …", "… dann was man sieht, dann was es bedeutet."], "mc": {"q": "Was ist die richtige Reihenfolge?", "o": ["Formale Aspekte → Beschreiben → Analysieren", "Analysieren → Beschreiben → Formale Aspekte", "Beschreiben → Analysieren → Formale Aspekte", "Formale Aspekte → Analysieren → Beschreiben"]}, "g": "karikatur"}, {"id": "k2", "t": "kar", "q": "Was gehört zu den formalen Aspekten einer Karikatur?", "a": "Autor, Titel, Quellenart, Wo?, Wann?, historischer Kontext.", "x": "Achtung Rechtschreibung: „Autor“ (nicht „Author“).", "h": ["Sechs Punkte: wer, wie heißt sie, welche Art …", "… wo, wann, welcher Zusammenhang."], "mc": {"q": "Was gehört NICHT zu den formalen Aspekten?", "o": ["Kritik an wen?", "Autor", "Quellenart", "historischer Kontext"]}, "g": "karikatur", "hl": 0}, {"id": "k3", "t": "kar", "q": "Was machst du beim Schritt „Beschreiben“?", "a": "Vordergrund und Hintergrund beschreiben: Was sieht man?", "w": "Warum solltest du beim Beschreiben noch nicht deuten?", "mc": {"q": "Was gehört zum Beschreiben?", "o": ["Vordergrund/Hintergrund – was sieht man?", "Kritik an wen?", "Wer ist der Autor?", "Was könnte das bedeuten?"]}, "g": "karikatur", "hl": 1}, {"id": "k4", "t": "kar", "q": "Welche Fragen stellst du beim Schritt „Analysieren“?", "a": "Was könnte das bedeuten? Wer wurde dargestellt? Kritik an wen?", "h": ["Drei Fragen: Bedeutung, Person, Kritik"], "mc": {"q": "Welche Frage gehört zum Analysieren?", "o": ["Kritik an wen?", "Wann erschien sie?", "Was ist im Hintergrund?", "Wie heißt der Titel?"]}, "g": "karikatur", "hl": 2}, {"id": "k5", "t": "kar", "q": "Zu welchem Schritt gehört: „Im Vordergrund steht ein dicker Mann mit Zylinder auf einer Weltkugel.“?", "a": "Beschreiben – du gibst wieder, was man sieht, ohne es zu deuten.", "mc": {"o": ["Beschreiben", "Formale Aspekte", "Analysieren", "Gar keinem"]}, "g": "karikatur", "hl": 1}, {"id": "k6", "t": "kar", "q": "Zu welchem Schritt gehört: „Der Zeichner kritisiert die Gier der Kolonialmächte.“?", "a": "Analysieren – du deutest die Bedeutung und sagst, wen die Karikatur kritisiert.", "mc": {"o": ["Analysieren", "Beschreiben", "Formale Aspekte", "Gar keinem"]}, "g": "karikatur", "hl": 2}, {"id": "k7", "t": "kar", "q": "Zu welchem Schritt gehört: „Die Karikatur erschien 1904 in einer deutschen Satirezeitschrift.“?", "a": "Formale Aspekte – das sind Wann, Wo und Quellenart.", "mc": {"o": ["Formale Aspekte", "Beschreiben", "Analysieren", "Gar keinem"]}, "g": "karikatur", "hl": 0}, {"id": "g1", "t": "glo", "q": "Was bedeutet „Arbeiterbewegung“?", "a": "Der Kampf für bessere Arbeitsbedingungen.", "z": "Dazu gehörten z. B. Gewerkschaften und Arbeiterparteien.", "mc": {"o": ["Kampf für bessere Arbeitsbedingungen", "Gesellschaft ohne Klassen", "Ausweitung von Macht und Einfluss", "Versammlung auf dem Hambacher Schloss"]}, "g": "glossar", "hl": 0}, {"id": "g2", "t": "glo", "q": "Was bedeutet „Kommunismus“?", "a": "Eine Gesellschaft ohne Klassen.", "z": "Nach Karl Marx sollen Fabriken und Boden allen gehören – notfalls erkämpft durch eine Revolution.", "mc": {"o": ["Gesellschaft ohne Klassen", "Ohne Gewalt für die Arbeiter", "Kampf für bessere Arbeitsbedingungen", "Herrschaft des Adels"]}, "g": "glossar", "hl": 1}, {"id": "g3", "t": "glo", "q": "Was bedeutet „Sozialdemokratie“?", "a": "Ohne Gewalt für die Arbeiter eintreten.", "z": "Also durch Reformen, Wahlen und Gesetze statt durch Revolution.", "mc": {"o": ["Ohne Gewalt für die Arbeiter", "Gesellschaft ohne Klassen", "Eigene Nation ist die beste", "Gleichgewicht der Mächte"]}, "g": "glossar", "hl": 2}, {"id": "g4", "t": "glo", "q": "Was ist der Unterschied zwischen Kommunismus und Sozialdemokratie?", "a": "Kommunismus will eine Gesellschaft ohne Klassen. Sozialdemokratie setzt sich ohne Gewalt für die Arbeiter ein.", "z": "Kommunisten hielten oft eine Revolution für nötig, Sozialdemokraten setzten auf Reformen.", "w": "Welcher Weg erscheint dir realistischer – und warum?", "g": "glossar"}, {"id": "c1", "t": "kla", "q": "Adel: Worauf beruhte seine Stellung, und welche Rolle hatte er?", "a": "Grundlage: Familienbesitz, hoher sozialer Rang → Abstammung. Führende Position in Politik und Militär.", "h": ["Man wird hineingeboren …", "Politik und …"], "mc": {"q": "Was war die Grundlage des Adels?", "o": ["Abstammung, Familienbesitz, hoher Rang", "Bildung", "Kapital aus Fabriken", "Landwirtschaft"]}, "g": "klassen", "hl": 0}, {"id": "c2", "t": "kla", "q": "Was war die Grundlage des Wirtschaftsbürgertums?", "a": "Kapital und Besitz, z. B. Familienbesitz, Unternehmen.", "mc": {"q": "Ein Fabrikbesitzer gehört zum …", "o": ["Wirtschaftsbürgertum", "Bildungsbürgertum", "Kleinbürgertum", "Adel"]}, "g": "klassen", "hl": 1}, {"id": "c3", "t": "kla", "q": "Was war die Grundlage des Bildungsbürgertums?", "a": "Bildung, z. B. Anwälte und Ärzte.", "mc": {"q": "Ein Arzt gehört zum …", "o": ["Bildungsbürgertum", "Wirtschaftsbürgertum", "Kleinbürgertum", "Proletariat"]}, "g": "klassen", "hl": 1}, {"id": "c4", "t": "kla", "q": "Wie lebte das Bürgertum, und worauf war es stolz?", "a": "In hellen, geräumigen Villen oder Wohnungen; stolz auf das eigenständig Erreichte.", "w": "Warum war „selbst erreicht“ für Bürger so wichtig – im Gegensatz zum Adel?", "g": "klassen", "hl": 1}, {"id": "c5", "t": "kla", "q": "Beschreibe das Kleinbürgertum.", "a": "Bessere Arbeitsbedingungen als Arbeiter, aber niedriger Rang; hoffen auf Aufstieg; drohende Gefahr, ins Proletariat „abzurutschen“. Z. B. Handwerker, Angestellte, Dienstmädchen.", "h": ["Zwischen Bürgertum und Arbeitern …", "Hoffnung und Angst"], "mc": {"q": "Welche Schicht hoffte auf Aufstieg und fürchtete das Abrutschen ins Proletariat?", "o": ["Kleinbürgertum", "Adel", "Bildungsbürgertum", "Bauern"]}, "g": "klassen", "hl": 2}, {"id": "c6", "t": "kla", "q": "Beschreibe die Arbeiterschaft (das Proletariat).", "a": "Grundlage: kein Besitz, nur Arbeit. Keine Rechte, keine fairen Löhne, abhängig von Fabrikbesitzern. Wohnen in prekären (unsicheren, ärmlichen) Verhältnissen.", "x": "Achtung Rechtschreibung: „Proletariat“ (nicht „Poleteriat“).", "w": "Warum entstand gerade aus dieser Schicht die Arbeiterbewegung?", "mc": {"q": "Welche Schicht hatte keinen Besitz außer ihrer Arbeit?", "o": ["Arbeiterschaft (Proletariat)", "Kleinbürgertum", "Bauern", "Bildungsbürgertum"]}, "g": "klassen", "hl": 3}, {"id": "c7", "t": "kla", "q": "Welche Probleme hatten die Bauern?", "a": "Grundlage: Landwirtschaft. Der industrielle Fortschritt führte zu rentablen Großbetrieben; ausländische Waren gefährdeten ihre Lebensgrundlage.", "z": "Zum Beispiel billiges Getreide aus Amerika und Russland.", "mc": {"q": "Was gefährdete die Lebensgrundlage der Bauern?", "o": ["Ausländische Waren und rentable Großbetriebe", "Der Wiener Kongress", "Die Mission", "Zu viel Bildung"]}, "g": "klassen", "hl": 3}, {"id": "c8", "t": "kla", "q": "Ordne die Schichten der Klassengesellschaft von oben nach unten.", "a": "Adel → Bürgertum (Wirtschafts- und Bildungsbürgertum) → Kleinbürgertum → Arbeiterschaft und Bauern", "z": "Das ist ein vereinfachtes Modell: Großbauern konnten auch wohlhabend sein.", "g": "klassen"}, {"id": "c9", "t": "kla", "q": "Wie hängen Klassengesellschaft und Imperialismus zusammen?", "a": "Die Not der Arbeiter (soziale Frage) sollte auch durch Kolonien gelöst werden: das Volk zu Hause einen und von den Problemen ablenken – das gesellschaftliche Motiv.", "z": "Diese Verknüpfung steht nicht wörtlich in der Mitschrift, ist aber eine typische Transferfrage.", "w": "Findest du, dass Kolonien die soziale Frage wirklich lösen konnten?", "g": "motive", "hl": 1}, {"id": "r1", "t": "rev", "q": "Wann fand der Wiener Kongress statt?", "a": "1814/15", "mc": {"o": ["1814/15", "1832", "1848", "1871"]}, "g": "zeit", "hl": 0}, {"id": "r2", "t": "rev", "q": "Was wollten die Fürsten auf dem Wiener Kongress?", "a": "Das Gleichgewicht der Mächte zur Sicherung des Friedens – und den eigenen Machterhalt.", "z": "Diese Politik nennt man „Restauration“: die alte Ordnung wiederherstellen.", "h": ["Zwei Ziele: Frieden und …"], "mc": {"q": "Was war ein Ziel der Fürsten 1814/15?", "o": ["Gleichgewicht der Mächte und eigener Machterhalt", "Ein deutscher Nationalstaat mit Verfassung", "Kolonien in Afrika", "Wahlrecht für alle"]}, "g": "zeit", "hl": 0}, {"id": "r3", "t": "rev", "q": "Welche Folgen hatte die Politik des Wiener Kongresses?", "a": "Die Nationalbewegung wurde unterdrückt → die Menschen waren unzufrieden und wollten mitbestimmen.", "z": "Z. B. die Karlsbader Beschlüsse 1819: Zensur und Überwachung der Universitäten.", "g": "zeit", "hl": 0}, {"id": "r4", "t": "rev", "q": "Was war der Vormärz?", "a": "Die Zeit vor der Märzrevolution 1848: Unruhen und Versammlungen, z. B. 1832 auf dem Hambacher Schloss. Forderung nach Nationalstaat und Verfassung. Die Fürsten reagierten mit Unterdrückung.", "h": ["Der Name sagt: vor dem März …", "… welchem März? 1848"], "g": "zeit", "hl": 1}, {"id": "r5", "t": "rev", "q": "Wann und wo fand die berühmte Versammlung im Vormärz statt?", "a": "1832 auf dem Hambacher Schloss (Hambacher Fest).", "z": "Dort wehten schwarz-rot-goldene Fahnen – Symbol für Einheit und Freiheit.", "mc": {"q": "Wann war das Hambacher Fest?", "o": ["1832", "1815", "1848", "1849"]}, "g": "zeit", "hl": 1}, {"id": "r6", "t": "rev", "q": "Was forderten die Menschen im Vormärz?", "a": "Einen Nationalstaat und eine Verfassung.", "z": "Kurz gesagt: „Einheit und Freiheit“.", "mc": {"o": ["Nationalstaat und Verfassung", "Kolonien und Stützpunkte", "Rückkehr der Fürsten", "Gesellschaft ohne Klassen"]}, "g": "zeit", "hl": 1}, {"id": "r7", "t": "rev", "q": "Was geschah im März 1848?", "a": "Eine aktive Revolution mit Straßenkämpfen; der preußische König versprach Reformen; die erste Nationalversammlung trat in Frankfurt zusammen.", "z": "Die Nationalversammlung tagte ab Mai 1848 in der Frankfurter Paulskirche. Der preußische König war Friedrich Wilhelm IV.", "h": ["Straßen …", "… König …", "… Frankfurt"], "g": "zeit", "hl": 2}, {"id": "r8", "t": "rev", "q": "Was war das Ziel der Nationalversammlung in Frankfurt?", "a": "Eine Verfassung mit Menschen- und Bürgerrechten und Wahlrecht.", "mc": {"o": ["Verfassung mit Menschen- und Bürgerrechten, Wahlrecht", "Gleichgewicht der Mächte", "Ein Kolonialreich in Afrika", "Die Macht der Fürsten sichern"]}, "g": "zeit", "hl": 3}, {"id": "r9", "t": "rev", "q": "Nenne Gründe, warum die Revolution scheiterte.", "a": "1. Die Fürsten erlangten die Macht zurück (sie hatten das Militär). 2. Der preußische König lehnte die Verfassung ab. 3. Die Revolutionäre waren sich nicht einig. 4. Politiker schlossen Kompromisse mit der Obrigkeit.", "z": "Genauer: 1849 lehnte Friedrich Wilhelm IV. die Kaiserkrone ab, die ihm die Nationalversammlung angeboten hatte – und damit auch die Reichsverfassung.", "h": ["Vier Gründe: Militär, König, Streit, Kompromisse"], "g": "zeit", "hl": 4}, {"id": "r10", "t": "rev", "q": "Was lehnte der preußische König ab?", "a": "Die /* Prüft einen Stapel vollständig. Rückgabe: Liste verständlicher Fehler (leer = gültig). */
function deckErrors(d){
  const E=[],str=x=>typeof x==="string"&&x.trim()!=="";

  if(!T.length)E.push("Themen fehlen.");

  T.forEach((t,i)=>{if(!t||!str(t.id)||!str(t.n))E.push(`Thema ${i+1}: id oder Name fehlt.`);else if(t.c!=null&&!/^#[0-9a-fA-F]{6}$/.test(t.c))E.push(`Thema „${t.n}“: Farbe ungültig.`)});
  const G=d.graphics==null?{}:d.graphics;
  if(typeof G!=="object"||Array.isArray(G))E.push("Grafiken haben ein falsches Format.");
  else Object.keys(G).forEach(k=>{const g=G[k],it=g&&g.items,pair=g&&(g.k==="timeline"||g.k==="list");
    if(!g||!["wheel","pyramid","steps","timeline","list"].includes(g.k)||!Array.isArray(it)||!it.length)E.push(`Grafik „${k}“ ist ungültig.`);
    else if(pair&&!it.every(x=>Array.isArray(x)&&x.length===2&&x.every(y=>typeof y==="string")))E.push(`Grafik „${k}“: Einträge müssen Paare sein.`);
    else if(!pair&&!it.every(x=>typeof x==="string"))E.push(`Grafik „${k}“: Einträge müssen Texte sein.`)});
  const C=Array.isArray(d.cards)?d.cards:[],ids=new Set();
  if(!C.length)E.push("Der Stapel enthält keine Karten.");
  C.forEach((c,i)=>{const n="Karte "+(c&&str(c.id)?c.id:i+1);
    if(!c||typeof c!=="object"){E.push(n+": ungültig.");return}
    if(!str(c.id))E.push(n+": id fehlt.");else if(ids.has(c.id))E.push(n+": id doppelt.");else ids.add(c.id);
    if(!tids.includes(c.t))E.push(n+": Thema unbekannt.");
    if(!str(c.q)||!str(c.a))E.push(n+": Frage oder Antwort fehlt.");
    ["x","z","w"].forEach(k=>{if(c[k]!=null&&typeof c[k]!=="string")E.push(`${n}: ${k} muss Text sein.`)});
    ["h","s"].forEach(k=>{if(c[k]!=null&&!(Array.isArray(c[k])&&c[k].every(x=>typeof x==="string")))E.push(`${n}: ${k} muss eine Liste von Texten sein.`)});
    if(c.mc!=null){const o=c.mc&&c.mc.o;if(!Array.isArray(o)||o.length<2||!o.every(str)||new Set(o).size!==o.length)E.push(n+": Quiz braucht mindestens 2 verschiedene Antworten.");else if((c.mc.q!=null&&typeof c.mc.q!=="string")||(c.mc.x!=null&&typeof c.mc.x!=="string"))E.push(n+": Quiztext ungültig.")}
    if(c.num!=null){if(typeof c.num!=="object"||typeof c.num.v!=="number"||!isFinite(c.num.v))E.push(n+": Rechenwert ungültig.");else if(c.num.tol!=null&&!(typeof c.num.tol==="number"&&c.num.tol>=0&&c.num.tol<1))E.push(n+": Toleranz ungültig.")}
    if(c.g!=null){const g=typeof G==="object"&&G?G[c.g]:null;if(!g)E.push(`${n}: Grafik „${c.g}“ fehlt.`);else if(c.hl!=null&&!(Number.isInteger(c.hl)&&c.hl>=0&&Array.isArray(g.items)&&c.hl<g.items.length))E.push(n+": Markierung außerhalb der Grafik.")}
  });
  if(d.match!=null){if(!Array.isArray(d.match))E.push("Zuordnen hat ein falsches Format.");else d.match.forEach((m,i)=>{const p=m&&m.p;if(!m||!str(m.n)||!Array.isArray(p)||p.length<2||!p.every(x=>Array.isArray(x)&&x.length===2&&x.every(str)))E.push(`Zuordnen ${i+1}: ungültig.`);else if(new Set(p.map(x=>x[0])).size!==p.length||new Set(p.map(x=>x[1])).size!==p.length)E.push(`Zuordnen „${m.n}“: Paare nicht eindeutig.`)})}
  if(d.exam!=null){if(!Array.isArray(d.exam))E.push("Probeklausur hat ein falsches Format.");else d.exam.forEach((x,i)=>{if(!x||!tids.includes(x.t)||!str(x.q)||!Array.isArray(x.p)||!x.p.length||!x.p.every(str))E.push(`Probeklausur-Aufgabe ${i+1}: ungültig.`)})}
  return E;
}
function normDeck(d){d.graphics=d.graphics||{};d.match=d.match||[];d.exam=d.exam||[];d.topics.forEach(t=>{if(!t.c)t.c="#2f4fd1"});return d}

function activeFilter(){return (S.filter||[]).filter(id=>D.topics.some(t=>t.id===id))}

function examTime(){const e=examDate();return e?new Date(e+"T08:00").getTime():0}
function examInfo(){const e=examDate();if(!e)return"";const a=new Date(e+"T00:00"),b=new Date(today()+"T00:00");const d=Math.round((a-b)/864e5);if(d<0)return"";return d===0?"Arbeit heute":d===1?"Arbeit morgen":"Arbeit in "+d+" Tagen"}
function ivl(lv){const m=[1,5,30,240,1440,4320,10080][Math.min(lv,6)];const ex=examTime(),now=Date.now();if(ex>now){return Math.min(m,Math.max(5,(ex-now)/120000))}return m}
function stats(cards){const n=cards.length,now=Date.now();let sum=0,mast=0,due=0,seen=0;cards.forEach(c=>{const k=ck(c.id);sum+=Math.min(k.lv,4)/4;if(k.lv>=3)mast++;if(k.n>0){seen++;if(k.due<=now)due++}});return{n,mast,due,seen,pct:n?Math.round(sum/n*100):0,mastPct:n?Math.round(mast/n*100):0}}

function gfx(c){
  const g=c.g&&D.graphics&&D.graphics[c.g];if(!g)return"";const hl=c.hl;
  if(g.k==="wheel"){
    const n=g.items.length,cx=170,cy=118,rx=112,ry=86;
    const pts=g.items.map((t,i)=>{const a=(-90+i*360/n)*Math.PI/180;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a),t,i]});
    const lines=pts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width="2"/>`).join("");
    const boxes=pts.map(p=>{const on=p[3]===hl;return`<rect x="${(p[0]-54).toFixed(1)}" y="${(p[1]-15).toFixed(1)}" width="108" height="30" rx="15" fill="${on?"var(--orange)":"var(--soft)"}" stroke="${on?"var(--orange)":"var(--line)"}"/><text x="${p[0].toFixed(1)}" y="${(p[1]+4.5).toFixed(1)}" text-anchor="middle" font-size="12.5" fill="${on?"#fff":"var(--ink)"}">${esc(p[2])}</text>`}).join("");
    return`<div class="gx"><svg viewBox="0 0 340 236" role="img" aria-label="${esc(g.c)}: ${esc(g.items.join(", "))}">${lines}<circle cx="${cx}" cy="${cy}" r="50" fill="var(--coral)"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12.5" fill="#fff">${esc(g.c)}</text>${boxes}</svg></div>`;
  }
  if(g.k==="pyramid"){
    const n=g.items.length,top=8,H=210,bh=(H-top-8)/n,gap=4,w=y=>56+(y-top)/(H-top)*270;
    const bands=g.items.map((t,i)=>{const y0=top+i*bh,y1=y0+bh-gap,a=w(y0),b=w(y1),on=hl===i||hl==null;const f=hl==null?["var(--coral)","#f2911b","#8b5cf6","var(--blue)"][i%4]:(on?"var(--orange)":"var(--soft)");
      return`<polygon points="${170-a/2},${y0} ${170+a/2},${y0} ${170+b/2},${y1} ${170-b/2},${y1}" fill="${f}" stroke="var(--line)"/><text x="170" y="${(y0+y1)/2+4.5}" text-anchor="middle" font-size="13" fill="${hl==null||on?"#fff":"var(--ink)"}">${esc(t)}</text>`}).join("");
    return`<div class="gx"><svg viewBox="0 0 340 ${H}" role="img" aria-label="Schichten: ${esc(g.items.join(", "))}">${bands}</svg></div>`;
  }
  if(g.k==="steps")return`<div class="gx steps">${g.items.map((t,i)=>`${i?'<span class="ar">→</span>':""}<span class="st${i===hl?" hl":""}">${fmt(t)}</span>`).join("")}</div>`;
  if(g.k==="timeline")return`<div class="gx">${g.items.map((r,i)=>`<div class="tlr${i===hl?" hl":""}"><span class="y">${fmt(r[0])}</span><span class="d"></span><span>${fmt(r[1])}</span></div>`).join("")}</div>`;
  if(g.k==="list")return`<div class="gx lst">${g.items.map((r,i)=>`<b class="${i===hl?"hl":""}">${fmt(r[0])}</b><span class="${i===hl?"hl":""}">${fmt(r[1])}</span>`).join("")}</div>`;
  return"";
}

function buildQueue(){
  const now=Date.now(),cards=filtered();
  const due=cards.filter(c=>ck(c.id).n>0&&ck(c.id).due<=now).sort((a,b)=>ck(a.id).due-ck(b.id).due);
  const neu=roundRobin(cards.filter(c=>!ck(c.id).n));
  let q=due.concat(neu);
  if(q.length<12)q=q.concat(cards.filter(c=>!q.includes(c)).sort((a,b)=>ck(a.id).lv-ck(b.id).lv||ck(a.id).due-ck(b.id).due));
  return roundRobin(q.slice(0,12)).map(c=>c.id);
}

/* Zählt diese Antwort für den Stufenaufstieg? Nur selbstständig (ohne Hinweis), nicht als Wiederholung in derselben Runde
   und bei bekannten Karten erst ab dem fälligen Termin. Alles andere ist Übung. */
function practiceReason(c){const k=ck(c.id);if(L.hints>0)return"mit Hinweis";if((L.rq[c.id]||0)>0)return"Wiederholung in dieser Runde";if(k.n>0&&k.due>Date.now())return"vor dem fälligen Termin";return""}
function rateCard(v){
  const c=byId(L.q[L.i]),why=practiceReason(c),k=cs(c.id),now=Date.now();k.n++;k.last=now;
  let pts=v===2?10:v===1?5:2;pts=Math.max(1,pts-2*L.hints);
  if(v===2){k.ok++;S.stats.ok++;L.ok++;k.over=0;
    if(!why){k.lv=Math.min(k.lv+1,6);L.up++;k.due=now+ivl(k.lv)*60000}
    else if(why!=="vor dem fälligen Termin"){k.due=now+ivl(why==="mit Hinweis"?0:Math.max(1,k.lv))*60000}
  }
  else if(v===1){k.due=Math.min(k.due||Infinity,now+ivl(Math.max(0,k.lv-1))*60000)}
  else{k.lv=0;k.bad++;if(L.conf===2)k.over=1;k.due=now+60000}
  if((L.conf===2&&v===2)||(L.conf===0&&v===0))S.stats.calib++;
  S.points+=pts;L.pts+=pts;L.n++;
  if(v<2&&(L.rq[c.id]||0)<2){L.rq[c.id]=(L.rq[c.id]||0)+1;L.q.splice(Math.min(L.i+1+(v===0?3:5),L.q.length),0,c.id)}
  L.i++;L.flip=false;L.conf=null;L.hints=0;L.typed="";L.num="";L.showType=false;hush();save();render();checkTro();
}
function learnEnd(){

function startQuiz(test){
  const pool=(test?D.cards:filtered()).filter(c=>c.mc&&c.mc.o&&c.mc.o.length>1);
  const n=Math.min(test?12:10,pool.length);if(!n){toast("Hier gibt es keine Quizfragen");return}
  const pick=roundRobin(shuffle(pool)).slice(0,n);
  Q={test,hide:!test&&S.set.hide!==false,shown:false,free:"",items:pick.map(c=>({id:c.id,opts:shuffle(c.mc.o.map((t,i)=>({t,ok:i===0})))})),i:0,ans:null,score:0,by:{}};markDay();go("quiz");
}
function quiz(){
  if(Q.i>=Q.items.length)return quizEnd();
  const it=Q.items[Q.i],c=byId(it.id),tp=topic(c.t),a=Q.ans;
  const opts=it.opts.map((o,i)=>`<button class="opt${a!=null&&o.ok?" ok":""}${a===i&&!o.ok?" no":""}" data-act="pick" data-v="${i}" ${a!=null?"aria-disabled=\"true\"":""}>${fmt(o.t)}</button>`).join("");
  const right=a!=null&&it.opts[a].ok,fb=quizFb(c,it),veil=Q.hide&&!Q.shown&&a==null;
  V.innerHTML=`<div class="sbar"><button class="x" data-act="home" aria-label="Beenden">✕</button><div class="meter grow"><i style="width:${Q.i/Q.items.length*100}%;background:var(--blue)"></i></div><span class="sub nowrap">${Q.i+1} / ${Q.items.length}</span></div>
  <div class="ctop"><span class="chip" style="--c:${esc(tp.c)}"><i></i>${esc(tp.n)}</span><span class="sub">${Q.test?"Lernstand-Test":"Quiz"}</span></div>
  <h2 class="q">${fmt(c.mc.q||c.q)}</h2>${veil?`<label for="qfree" class="sub">Erst frei antworten – dann die Auswahl aufdecken</label><textarea id="qfree" placeholder="Deine Antwort aus dem Kopf …">${esc(Q.free)}</textarea>
  <button class="btn mt" data-act="qreveal" style="width:100%">Auswahl zeigen</button><p class="sub mt">Verdecken kannst du unter „Mehr“ ausschalten.</p>`:opts}
  ${a!=null&&Q.free.trim()?`<div class="zbox mine"><b>Deine freie Antwort:</b> ${esc(Q.free)}</div>`:""}
  ${a!=null?`<div class="fb" role="status"><b class="${right?"g":"n"}">${right?"Richtig! +10":"Nicht ganz."}</b><br>${fb.html}${right?"":"<br><span class=\"sub\">Diese Frage kommt morgen als Fehler-Revanche wieder – ohne Auswahl.</span>"}</div><div class="row"><button class="btn ghost sm" data-act="say">Vorlesen</button><button class="btn" data-act="qnext" style="flex:1">Weiter</button></div>`:""}`;
}
/* Rückmeldung passend zur tatsächlich gestellten Quizfrage (eigene Quizfrage mc.q ≠ Kartenfrage). */
function quizFb(c,it){const right=it?it.opts.find(o=>o.ok).t:c.mc.o[0],own=!!c.mc.q;let extra="";
  if(c.mc.x)extra=c.mc.x;else if(!own){if(plain(c.a)!==plain(right))extra=c.a;if(c.x)extra+=(extra?" ":"")+c.x}else if(c.x)extra=c.x;
  return{html:`Richtige Antwort: <b>${fmt(right)}</b>${extra?"<br>"+fmt(extra):""}`,text:"Richtige Antwort: "+plain(right)+". "+plain(extra)}}
/* Wird genau einmal beim Abschluss aufgerufen – nicht beim Anzeigen. */
function finishQuiz(){if(Q.saved)return;Q.saved=true;const n=Q.items.length,p=Math.round(Q.score/n*100);
  if(Q.test){P().tests.push({d:Date.now(),s:Q.score,n,by:Q.by});if(p>=80)S.stats.t80=1}else if(Q.score===n&&n>=5)S.stats.qp=1;
  save();checkTro()}
function quizEnd(){
  const n=Q.items.length,p=Math.round(Q.score/n*100);
  V.innerHTML=`<div class="big"><div class="e">${p>=80?"🦉":p>=50?"🦊":"🐣"}</div><div class="n">${Q.score} von ${n} richtig</div><p class="sub">${p} % · ${p>=80?"Stark!":p>=50?"Gut – die Fehler kommen in den Karteikarten wieder.":"Übe die Karteikarten – dann klappt's."}</p></div>
  ${Q.test?`<div class="card2"><b>Nach Themen</b>${Object.keys(Q.by).map(t=>{const r=Q.by[t];return`<div class="mrow"><div class="lbl">${esc(topic(t).n)}</div><div class="meter"><i style="width:${r[0]/r[1]*100}%;background:${esc(topic(t).c)}"></i></div><span class="pc">${r[0]}/${r[1]}</span></div>`}).join("")}</div>`:""}
  <div class="row"><button class="btn" data-act="learn" style="flex:1">Karteikarten</button><button class="btn ghost" data-act="${Q.test?"test":"quiz"}" style="flex:1">Nochmal</button></div>`;

function startMatch(si){const sets=D.match||[];if(!sets.length){toast("Für diesen Stapel gibt es kein Zuordnen");return}si=si||0;const s=sets[si];M={si,L:shuffle(s.p.map((_,i)=>i)),R:shuffle(s.p.map((_,i)=>i)),sel:null,done:[],err:0,bad:null,fin:false};markDay();go("match")}

  if(all&&!M.fin){M.fin=true;const pts=s.p.length*5+(M.err?0:20);S.points+=pts;M.pts=pts;if(!M.err)S.stats.mp=1;save();checkTro()}
  V.innerHTML=`<h2 class="h">Zuordnen</h2>
  <div class="tags">${D.match.map((m,i)=>`<button class="tag${i===M.si?" on":""}" data-act="mset" data-v="${i}">${esc(m.n)}</button>`).join("")}</div>

let importErr=[],pendingRestore=null;
/* Import: erst vollständig prüfen, dann speichern, erst danach aktivieren. Bei Fehlern bleibt der bisherige Stapel aktiv. */
function importDeck(txt){let o;importErr=[];
  try{o=JSON.parse(txt)}catch(err){importErr=["Die Datei ist keine gültige Lernkiste-Datei (kein JSON)."];toast("Stapel nicht übernommen");render();return}
  const err=deckErrors(o);if(o&&DECKS.some(b=>b.id===o.id))err.unshift("Diese Stapel-id ist schon fest eingebaut. Bitte eine andere id verwenden.");
  if(err.length){importErr=err;toast("Stapel nicht übernommen");render();return}
  normDeck(o);const next=decks.filter(d=>d.id!==o.id).concat(o);
  if(!store.set(DKEY,next.concat(decksBad))){importErr=["Speichern hat nicht geklappt – Stapel nicht übernommen."];render();return}
  decks=next;D=o;S.deck=o.id;save();toast("Stapel geladen: "+o.title);render()}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;

    case"dismisswarn":warns.splice(+v,1);render();break;
    case"exmode":{P().examMode=v;if(v==="own"&&!P().exam)P().exam=null;toast(save()?"Termin gespeichert":"Speichern hat nicht geklappt");render();break}
    case"bkfile":{try{const blob=new Blob([JSON.stringify(backup(),null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lernkiste-sicherung-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast("Sicherung erstellt – in „Dateien“ speichern")}catch(err){showBackupText()}break}
    case"bkcopy":{const t=JSON.stringify(backup());try{navigator.clipboard.writeText(t).then(()=>toast("Sicherung kopiert – z. B. in Notizen einfügen"),showBackupText)}catch(err){showBackupText()}break}
    case"rsok":{const r=pendingRestore;pendingRestore=null;if(!r)break;const okS=store.set(KEY,r.state),okD=okS&&store.set(DKEY,r.decks);if(!okS||!okD){toast("Speichern hat nicht geklappt – nichts geändert");render();break}
      Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,S0(),r.state);fixState();loadDecks(r.decks);D=allDecks().find(d=>d.id===S.deck)||pickDefault();toast("Sicherung wiederhergestellt");go("home");break}
    case"rsno":pendingRestore=null;render();break;
    case"tag":{if(!v)S.filter=[];else{const f=activeFilter();S.filter=f.includes(v)?f.filter(x=>x!==v):f.concat(v)}save();render();break}
    case"learn":startLearn();break;
    case"daily":startDaily();break;
    case"revflip":L.flip=true;L.anim=true;render();if(S.set.tts)speak(quizFb(byId(L.q[L.i].slice(2)),null).text);break;
    case"revrate":rateRev(+v);break;
    case"qreveal":Q.shown=true;render();break;
    case"hidetog":S.set.hide=S.set.hide===false;save();render();break;
    case"newsok":S.seenVersion=APP_VERSION;save();render();break;
    case"quiz":startQuiz(false);break;
    case"test":startQuiz(true);break;
    case"match":startMatch(0);break;
    case"mset":startMatch(+v);break;
    case"exam":startExam(false);break;
    case"hint":L.hints++;render();break;
    case"type":L.showType=!L.showType;render();if(L.showType){const t=$("#typed");if(t)t.focus()}break;
    case"flip":{L.conf=+v;L.flip=true;L.anim=true;render();if(S.set.tts)speak(sayText(byId(L.q[L.i])));break}
    case"rate":rateCard(+v);break;
    case"say":{if(cur==="learn"){const r=String(L.q[L.i]);speak(r.startsWith("r:")?quizFb(byId(r.slice(2)),null).text:sayText(byId(r)))}else if(cur==="quiz"&&Q.items[Q.i]){const it=Q.items[Q.i];speak(quizFb(byId(it.id),it).text)}break}
    case"pick":{if(Q.ans!=null)break;const it=Q.items[Q.i],c=byId(it.id),ok=it.opts[+v].ok,k=cs(c.id);Q.ans=+v;const r=Q.by[c.t]||(Q.by[c.t]=[0,0]);r[1]++;
      /* Quiz wird getrennt erfasst. Ein Fehler plant eine Wiederholung ein, ohne die Karteistufe zu senken. */
      k.qn=(k.qn||0)+1;if(ok){Q.score++;r[0]++;S.points+=10;k.qok=(k.qok||0)+1}else{k.qbad=(k.qbad||0)+1;if(k.n>0)k.due=Math.min(k.due||Infinity,Date.now());k.rev={due:Math.min((k.rev&&k.rev.due)||Infinity,nextDay()),n:(k.rev&&k.rev.n)||0}}
      save();render();break}
    case"qnext":Q.i++;Q.ans=null;Q.shown=false;Q.free="";hush();if(Q.i>=Q.items.length)finishQuiz();render();break;
    case"ml":M.sel=+v;render();break;
    case"mr":{if(M.sel==null){toast("Tippe zuerst links einen Begriff");break}if(+v===M.sel){M.done.push(+v)}else{M.err++;M.bad=+v}M.sel=null;render();break}
    case"exresume":{const dr=P().examDraft;E={i:dr.i,show:!!dr.show,ticks:dr.ticks||[],got:dr.got||0,max:dr.max||0,txt:dr.txt||"",locked:dr.locked||""};render();break}
    case"exnew":startExam(true);break;
    case"eshow":E.show=true;E.locked=E.txt;saveDraft(true);render();break;
    case"tick":{const i=+v;E.ticks=E.ticks.includes(i)?E.ticks.filter(x=>x!==i):E.ticks.concat(i);saveDraft(true);render();break}
    case"enext":{const it=D.exam[E.i];E.got+=E.ticks.length;E.max+=it.p.length;S.points+=E.ticks.length*5;E.i++;E.show=false;E.ticks=[];E.txt="";E.locked="";
      if(E.i>=D.exam.length){S.stats.ex=1;if(E.max&&E.got/E.max*100>=PASS)S.stats.exPass=1}saveDraft(true);render();V.scrollTop=0;checkTro();break}
    case"copy":{const done=()=>toast("Kopiert – jetzt z. B. in WhatsApp einfügen");const fall=()=>{$("#rep").innerHTML=`<textarea readonly style="min-height:160px">${esc(report)}</textarea><p class="sub">Text markieren und kopieren.</p>`};try{navigator.clipboard.writeText(report).then(done,fall)}catch(err){fall()}break}
    case"tts":S.set.tts=!S.set.tts;save();render();break;
    case"rate2":S.set.rate=+v;save();render();break;
    case"saytest":speak("Hallo! So klingt die Vorlesestimme.");break;
    case"deck":{const d=allDecks().find(x=>x.id===v);if(d){D=d;S.deck=d.id;save();toast("Stapel gewechselt");render()}break}
    case"reset":if(!S._rs){S._rs=true;render()}else{S._rs=false;delete S.p[D.id];save();toast("Fortschritt zurückgesetzt");render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="typed"&&L)L.typed=e.target.value;if(e.target.id==="etxt"&&E){E.txt=e.target.value;saveDraft(false)}if(e.target.id==="numin"&&L)L.num=e.target.value;if(e.target.id==="qfree"&&Q)Q.free=e.target.value});
document.addEventListener("change",e=>{
  if(e.target.id==="exdate"){P().exam=e.target.value||null;if(!P().exam)P().examMode="none";toast(save()?(P().exam?"Datum gespeichert":"Termin gelöscht – du lernst ohne Termin"):"Speichern hat nicht geklappt");render()}
  if(e.target.id==="backupfile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>{let o=null;try{o=JSON.parse(r.result)}catch(err){}
    if(!o||o.app!=="lernkiste"||!o.state||typeof o.state!=="object"||typeof o.state.p!=="object"){toast("Das ist keine Lernkiste-Sicherung");return}
    pendingRestore={date:o.date||Date.now(),state:o.state,decks:Array.isArray(o.decks)?o.decks:[]};render()};r.readAsText(e.target.files[0]);e.target.value=""}
  if(e.target.id==="deckfile"&&e.target.files&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>importDeck(r.result);r.onerror=()=>{importErr=["Die Datei konnte nicht gelesen werden."];render()};
    r.readAsText(e.target.files[0]);e.target.value="";
  }
});
try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
/* Offline-Start: Service Worker nur bei echtem Webhosting (z. B. GitHub Pages). */
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
render();checkTro();
}
</script>
