<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lernkiste-Maskottchen: lächelnde Kiste mit Karteikarte. Inhalt im inneren Kreis (r ≤ 200), damit Android es beim Maskieren nicht abschneidet. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5ce0"/>
      <stop offset="1" stop-color="#2f4fd1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="400" cy="120" r="10" fill="#fff" opacity=".35"/>
  <circle cx="118" cy="150" r="6" fill="#fff" opacity=".35"/>
  <!-- Karteikarte -->
  <g transform="rotate(-10 256 170)">
    <rect x="176" y="96" width="160" height="128" rx="14" fill="#fff"/>
    <rect x="198" y="124" width="96" height="11" rx="5.5" fill="#2f4fd1" opacity=".85"/>
    <rect x="198" y="148" width="116" height="9" rx="4.5" fill="#dde5fa"/>
    <rect x="198" y="168" width="84" height="9" rx="4.5" fill="#dde5fa"/>
  </g>
  <!-- Kiste -->
  <rect x="132" y="196" width="248" height="186" rx="34" fill="#f2911b"/>
  <rect x="120" y="184" width="272" height="44" rx="20" fill="#e8664d"/>
  <!-- Gesicht -->
  <circle cx="210" cy="282" r="22" fill="#fff"/>
  <circle cx="302" cy="282" r="22" fill="#fff"/>
  <circle cx="214" cy="286" r="11" fill="#1d2754"/>
  <circle cx="306" cy="286" r="11" fill="#1d2754"/>
  <circle cx="218" cy="281" r="4" fill="#fff"/>
  <circle cx="310" cy="281" r="4" fill="#fff"/>
  <ellipse cx="176" cy="322" rx="15" ry="9" fill="#e8664d" opacity=".55"/>
  <ellipse cx="336" cy="322" rx="15" ry="9" fill="#e8664d" opacity=".55"/>
  <path d="M232 326 Q256 350 280 326" fill="none" stroke="#1d2754" stroke-width="9" stroke-linecap="round"/>
</svg>
